function buildSession() {
  const range = rangePool();
  const mode = home.mode;
  const dirsAB = ["A", "B"].filter(d => home.dirs[d]);
  const propDirs = ["C", "D"].filter(d => home.dirs[d]);
  const pickAB = () => dirsAB[Math.floor(Math.random() * dirsAB.length)];

  /* ----- review: targets = weak compounds INSIDE the selected range only.
     Distractors come from the whole selected range (chooseDistractors widens
     that pool to all 121 only when the range itself has <4 compounds). ----- */
  if (mode === "review") {
    if (!dirsAB.length) return { questions: [], mode, intro: false, pool: range, notice: "復習では性質問題は出題できません。名前→構造／構造→名前を選んでください。" };
    const targets = shuffle(range.filter(c => recOf(c.id).needsReview)).slice(0, 10);
    if (!targets.length) return { questions: [], mode, intro: false, pool: range, notice: "この範囲に苦手な化合物はありません。" };
    const qs = targets.map(t => makeQuestion(t, pickAB(), range, home.diff, false));
    return { questions: qs, mode, intro: false, pool: range };
  }

  /* ----- versus: A/B only, two choices ----- */
  if (mode === "versus") {
    if (!dirsAB.length) return { questions: [], mode, intro: false, pool: range, notice: "見比べでは性質問題は出題できません。名前→構造／構造→名前を選んでください。" };
    const targets = shuffle(range).slice(0, Math.min(10, range.length));
    const qs = targets.map(t => makeQuestion(t, pickAB(), range, home.diff, true));
    return { questions: qs, mode, intro: false, pool: range };
  }

  /* ----- normal ----- */
  const pool = range;
  const cEligible = eligibleC(pool);
  if (!dirsAB.length) {
    /* Property directions only: serve registered sets, cycling the enabled
       C/D directions. No eligible set in range -> do not start (never fall
       back to a direction the user turned off). */
    if (!propDirs.length || !cEligible.length) {
      return { questions: [], mode, intro: false, pool, notice: "この範囲では性質問題が出題できません" };
    }
    const shuffledPQ = shuffle(cEligible);
    const order = shuffle(propDirs);
    const ct = shuffledPQ.slice(0, Math.min(10, shuffledPQ.length));
    return { questions: ct.map((q, i) => makeQuestion(byId[q.targetId], order[i % order.length], pool, home.diff, false)), mode, intro: false, pool };
  }

  const intro = !store.onboardingCompleted;
  const total = Math.min(10, pool.length);

  /* FIX: reserve C/D slots FIRST (about 20% of a 10-question set), placed in
     questions 6-10 so the intro first 5 stay A/B. Reserved targets are
     excluded from the A/B weighted pool: no duplicate targets in a session.
     Both C and D enabled -> one slot each when possible; only one enabled ->
     both slots go to it (subject to eligible unused sets). */
  let reserved = [];
  if (propDirs.length && cEligible.length && total > 1) {
    const tailRoom = intro ? Math.max(0, total - 5) : total;
    let reserveCount = Math.min(2, cEligible.length, tailRoom, total - 1);
    if (reserveCount > 0) {
      const picks = shuffle(cEligible).slice(0, reserveCount);
      let assign;
      if (reserveCount === 2 && propDirs.length === 2) assign = shuffle(propDirs); // one C, one D
      else if (propDirs.length === 2) assign = [propDirs[Math.floor(Math.random() * propDirs.length)]];
      else assign = picks.map(() => propDirs[0]);
      reserved = picks.map((q, i) => ({ target: byId[q.targetId], dir: assign[i % assign.length] }));
    }
  }
  const reservedIds = new Set(reserved.map(r => r.target.id));
  const abTargets = weightedPick(pool.filter(c => !reservedIds.has(c.id)), total - reserved.length);
  const abQs = abTargets.map((t, i) => {
    if (intro && i < 5) {
      /* Intro keeps only the curated direction order and the Q1 hint.
         Every question is FOUR-choice: the earlier two-choice warm-up
         (two:true) read as a bug — 四択ラッシュ labelled 四択 while showing
         2 choices — whenever storage was fresh, e.g. opening the shared
         link in an external browser whose localStorage is separate from
         the app card's (user report 2026-11-10, iPhone Chrome / Safari).
         Two-choice questions belong to versus （見比べ） mode only. */
      const pat = [
        { dir: "B", hint: true },
        { dir: "B" },
        { dir: "A" },
        { dir: "B" },
        { dir: "B" }
      ][i];
      if (!home.dirs[pat.dir]) pat.dir = dirsAB[0]; // dirsAB is non-empty here; never resurrect an OFF direction
      return Object.assign(makeQuestion(t, pat.dir, pool, home.diff, false), { hint: !!pat.hint });
    }
    return makeQuestion(t, pickAB(), pool, home.diff, false);
  });
  const resQs = reserved.map(r => makeQuestion(r.target, r.dir, pool, home.diff, false));
  let qs;
  if (intro) {
    // first 5 are the intro A/B pattern; reserved C/D sit inside questions 6-10
    qs = abQs.slice(0, 5).concat(shuffle(abQs.slice(5).concat(resQs)));
  } else if (total >= 6) {
    // first 5 stay A/B; reserved C/D are shuffled into questions 6-10
    qs = abQs.slice(0, 5).concat(shuffle(abQs.slice(5).concat(resQs)));
  } else {
    qs = abQs.concat(resQs);
  }
  return { questions: qs, mode, intro, pool };
}

/* Small 4-point stars (amber / honey) that spread 12–24px around an anchor
   element's edges and fade out. Positions are measured into the quiz fx
   layer, so particles sit around the element, never on top of text. */
function spawnStars(anchor, count) {
  /* Reduced motion no longer suppresses the stars entirely: the CSS calm
     keyframes drop the travel/rotation and keep only an opacity fade. */
  if (!anchor) return;
  const layer = $("#fx-quiz"); if (!layer) return;
  const lr = layer.getBoundingClientRect(), ar = anchor.getBoundingClientRect();
  if (!lr.width || !ar.width) return;
  /* Stars must never cross into the CHEM BOOST! body text: when a boost
     note is on screen, clamp both the spawn point and the travel target
     so each star's bottom edge stays above the boost text's top edge. */
  const boostText = document.querySelector("#q-feedback .boost-text");
  const limitY = boostText ? (boostText.getBoundingClientRect().top - lr.top) : null;
  const pts = [[.14, .04], [.86, .04], [.5, -.06], [.04, .55], [.96, .55], [.5, 1.06]];
  const cols = ["#DFA32E", "#E9B949", "#F2CE7A"];
  for (let i = 0; i < count; i++) {
    const s = document.createElement("span");
    s.className = "fx-star";
    const size = 9 + Math.round(Math.random() * 4);
    s.style.width = size + "px"; s.style.height = size + "px";
    const p = pts[i % pts.length];
    let spawnY = ar.top - lr.top + ar.height * p[1];
    const ang = Math.random() * Math.PI * 2, dist = 22 + Math.random() * 18;
    let dx = Math.round(Math.cos(ang) * dist), dy = Math.round(Math.sin(ang) * dist);
    if (limitY !== null) {
      const maxY = limitY - size / 2 - 1;
      if (spawnY > maxY) spawnY = maxY;
      if (spawnY + dy > maxY) dy = Math.round(maxY - spawnY);
    }
    s.style.left = (ar.left - lr.left + ar.width * p[0]) + "px";
    s.style.top = spawnY + "px";
    s.style.setProperty("--dx", dx + "px");
    s.style.setProperty("--dy", dy + "px");
    s.style.background = cols[i % cols.length];

  }
}

    if (!revenge && !wasEver) sessionNewEver++;

      if (mode === "normal" || mode === "review" || mode === "versus") { r.needsReview = false; r.missLevel = 0; }
      if (mode === "normal" || mode === "review") {
        if (q.choices.length >= 4) {
          const sid = session && session.id ? session.id : null;
          if (sid && r.lastFourChoiceSuccessSessionId !== sid) {
            r.fourChoiceSuccessCount = (r.fourChoiceSuccessCount || 0) + 1;
            r.lastFourChoiceSuccessSessionId = sid;

            if (!wasMastered && r.mastered) sessionNewMastered++;

          if (r.reviewStage === 1) { r.reviewStage = 2; r.nextReviewDate = addDaysStr(today, 3); }
          else if (r.reviewStage === 2) { r.reviewStage = 3; r.nextReviewDate = addDaysStr(today, 7); }

  "picric-acid": { "tag": "発見・由来", "title": "黄色い染料が爆薬にもなった意外な化学史", "body": [
    "ピクリン酸は、もともと爆薬として発見されたわけではない。1771年、化学者ピーター・ウルフがインジゴを硝酸で処理し、黄色い染料を得た。後にピクリン酸と呼ばれるこの物質は、絹や羊毛を染めるために利用された。しかし染色した色が洗濯などで落ちやすいという欠点もあった。",

  "phenyl-acetate": { "tag": "しくみ", "title": "酸素についたアセチル基が環へ移る不思議", "body": [

  "benzyl-alcohol": { "tag": "意外な関係", "title": "薬を守る保存剤が赤ちゃんには危険な理由", "body": [

    "新生児、とくに早産児では、ベンジルアルコールを代謝・排出する能力が十分ではない。過去には保存剤を含む医療用製剤などから大量に曝露され、重い代謝性アシドーシスや呼吸障害を起こした事例が報告された。現在は新生児への使用に厳しい注意が払われる。添加物は単なる脇役ではなく、使用する人の年齢や量まで考える必要があるのだ。"

  "benzaldehyde": { "tag": "しくみ", "title": "アルデヒド二分子から新しい結合を生む反応", "body": [

    "通常、C=Oの炭素は電子が不足して攻撃される側になりやすい。ところが、この反応では触媒の働きによって、一方の炭素が相手を攻撃する側として振る舞う。「極性転換」と呼ばれる発想だ。触媒は反応を速くするだけでなく、普段は起こりにくい結合の作り方を可能にする。分子の反応性を反転させる、巧妙な有機合成の例である。"

  "benzoic-acid": { "tag": "発見・由来", "title": "安息香という名前には樹脂の歴史が隠れている", "body": [
    "安息香酸という名前の「安息香」は、東南アジアなどに生育するエゴノキ科植物から得られる香りのある樹脂、ベンゾインに関係している。この樹脂には安息香酸やその誘導体が含まれ、古くから香料などとして利用されてきた。現在のように分子構造を理解する前から、人々はこの物質を利用していたのだ。",
    "1775年には化学者シェーレが安息香酸の分離に関わる研究を行い、その後1832年にはリービッヒとヴェーラーが構造の理解を進めた。現代ではトルエンを空気中の酸素で酸化する方法が工業的に用いられる。植物の樹脂から知られるようになった物質が、石油化学工業で大量生産される。名前に残る歴史と製造法の変化が面白い。"

  "sodium-benzoate": { "tag": "しくみ", "title": "保存料は微生物のエネルギー生産を妨げる", "body": [
    "安息香酸ナトリウムが保存料として働く理由は、単に食品を酸性にするからではない。酸性の環境では一部が分子の安息香酸となり、微生物の細胞膜を通過しやすくなる。細胞内へ入った安息香酸がH⁺を放すと、細胞内のpHを変化させ、微生物に負担をかける。",
    "酵母を用いた研究では、この変化によって糖の分解に関わる酵素の働きが妨げられ、ATPの量が減少することが示されている。微生物は細胞内の状態を元に戻すためにもエネルギーを使わなければならない。保存料の効果は、分子が細胞内へ入ったあとの生化学反応とも結びついているのだ。"
  ] },
  "phthalic-acid": { "tag": "発見・由来", "title": "ナフタレンから生まれた酸の名前に残る歴史", "body": [

  "isophthalic-acid": { "tag": "歴史・利用", "title": "芳香環の配置が耐熱繊維を生み出す理由とは", "body": [

    "メタ型アラミドでは、芳香環の結合方向が一直線ではなく折れ曲がった形になる。この構造は、高分子鎖の並び方や材料の柔軟性に影響する。同じ芳香族ポリアミドでも、パラ型アラミドとは性質や得意な用途が異なる。ベンゼン環の置換位置の違いが、最終的には防護服などの性能を左右する材料設計につながっている。"

  "terephthalic-acid": { "tag": "意外な関係", "title": "ペットボトルの原料が穴だらけの新素材になる", "body": [

  "phthalic-anhydride": { "tag": "意外な関係", "title": "無色の試薬を作る原料が色の変化を生み出す", "body": [

    "フェノールフタレインが酸性では無色、塩基性では赤紫色になるのは、H⁺の出入りに伴って分子内の電子の広がり方や構造が変わるためだ。特に塩基性では、光を吸収する性質が変わり、目に見える色が現れる。試薬を混ぜてできた新しい分子に、元の物質にはなかった機能が生まれる。これも有機合成の面白さだ。"

  "salicylic-acid": { "tag": "発見・由来", "title": "ヤナギの樹皮から近代医薬品への長い道のり", "body": [

    "19世紀半ばにはコルベらが化学合成法を発展させ、植物を大量に採取しなくてもサリチル酸を供給できる道が開かれた。さらに、その誘導体であるアスピリンが医薬品として普及する。経験的に使われていた植物から有効成分を調べ、構造を理解し、人工的に作る。近代の医薬品開発を象徴する歴史だ。"

  "sodium-salicylate": { "tag": "意外な関係", "title": "耳鳴りの研究に使われるサリチル酸の塩の秘密", "body": [

  ] },
  "aspirin": { "tag": "しくみ", "title": "一度働くと長く効くアスピリンと血小板の秘密", "body": [

  "aniline": { "tag": "発見・由来", "title": "十八歳の学生が紫色から始めた化学産業革命", "body": [
    "1856年、18歳の化学学生ウィリアム・パーキンは、マラリアの治療薬キニーネを人工的に作ろうとしていた。実験は目的どおりには進まなかったが、アニリンなどを酸化してできた物質から、鮮やかな紫色の染料を得た。これがモーブと呼ばれる、初期の商業的に成功した合成染料となった。",
    "それまで高価な天然染料に頼っていた衣料の世界に、化学工場で作れる色が登場した。パーキンは翌1857年に工場を開き、染料の大量生産を進めた。さらに合成染料の研究は、医薬品などの有機化学工業の発展にもつながった。目標と違う結果を見逃さなかったことが、新しい産業を生んだのである。"

  "anilinium-chloride": { "tag": "しくみ", "title": "水に溶ける塩を使うと染料づくりが進む理由", "body": [

    "この性質は染料を作る反応でも役立つ。アニリンのジアゾ化では、酸性の水溶液中で亜硝酸を作用させる。ただし、アニリンがすべてアニリニウムイオンになればよいわけではない。反応に関わる化学種の平衡も重要だ。溶けやすくする工夫と、反応を進める条件は、同じとは限らないのである。"
  ] },
  "acetanilide": { "tag": "歴史・利用", "title": "かつての解熱薬が安全性の研究を進めた歴史", "body": [
    "1886年、カーンとヘップはアセトアニリドに熱を下げる作用があることを報告した。翌年ごろには「アンチフェブリン」という名前で医薬品として販売され、当時の数少ない合成解熱鎮痛薬の一つとなった。しかし、使用が広がるにつれて、血液が酸素を運ぶ働きを妨げるなどの危険性が明らかになった。",
    "その後の研究では、体内でアセトアニリドの一部がアセトアミノフェンへ変わり、鎮痛作用に関わることがわかった。一方、別の代謝経路は有害な作用につながる。つまり、飲み込んだ薬の構造だけでなく、体内でどんな分子へ変わるかが重要なのだ。薬の歴史は、効き目と安全性を両方調べる必要性を物語る。"
  ] },
  "benzenediazonium-chloride": { "tag": "しくみ", "title": "窒素ガスが抜けると新しい結合ができる理由", "body": [

    "反応では窒素分子N₂が抜けることが重要だ。N₂は非常に安定な分子であり、その生成が反応の進行を後押しする。ただし、ジアゾニウム塩には不安定なものが多く、特に乾燥した塩の取り扱いには危険がある。そのため実験では低温の溶液中で作り、必要な反応へ続けることが多い。"

  "p-phenylazophenol": { "tag": "意外な関係", "title": "光を当てると形を変える色素分子の不思議", "body": [
    "p-フェニルアゾフェノールは、アゾベンゼンの一方の環にOH基がついた化合物だ。アゾベンゼン類には、光を吸収するとN=N結合の周囲の配置が変わり、トランス形とシス形の間で異性化するものがある。分子の形を光で切り替える性質は、分子スイッチの研究に役立つ。",
    "p-フェニルアゾフェノールでも光異性化が研究されているが、シス形からトランス形へ熱で戻る過程が速い場合がある。エタノール中で約0.2秒という短い緩和時間が報告されている。色素は単に光を吸収するだけではない。受け取った光のエネルギーで形を変え、元へ戻る動きまで示すことができるのだ。"
  ] },
  "sodium-ethoxide": { "tag": "しくみ", "title": "エステル同士をつないで炭素鎖を伸ばす塩基", "body": [
    "ナトリウムエトキシドは、炭素同士を新しく結びつける反応でも活躍する。酢酸エチルに作用させると、カルボニル基の隣にある炭素からH⁺を取り去り、反応性の高いエノラートを生じさせることができる。このエノラートが別の酢酸エチル分子を攻撃する。",
    "こうして新しいC–C結合ができ、適切な酸処理後にはアセト酢酸エチルが得られる。クライゼン縮合と呼ばれる反応だ。面白いのは、塩基が単に酸を中和するのではなく、普段は反応しにくいC–H結合の場所を利用して、炭素骨格を組み立てる点。小さな分子から複雑な有機物を作る基本技術の一つである。"
  ] },
  "246-trinitrotoluene": { "tag": "歴史・利用", "title": "強い爆薬なのに扱いやすさが重視された歴史", "body": [

    "20世紀には、融かしたTNTを容器に充填して固める方法が、軍需品の製造に利用された。ただし、比較的敏感でないことは安全を意味しない。TNTは爆発性と毒性をもつ危険物であり、製造や保管、廃棄には厳しい管理が必要だ。化学技術では目的の性能だけでなく、取り扱う際の物性も重要になることを示す歴史的な例である。"
  ] },
  "methane": { "tag": "意外な関係", "title": "酸素のない泥の中でメタンを作る微生物たち", "body": [

  "ethane": { "tag": "歴史・利用", "title": "天然ガスの成分をプラスチックの原料に変える", "body": [

function updateCombo(burst) {
  const el = $("#q-combo");
  el.textContent = "コンボ " + combo;
  el.classList.toggle("show", combo >= 2);
  /* T5: milestones at 3 / 5 / 8 — a small bounce plus an amber glint.
     Callers pass burst=false when T3 fires for the same answer, so the
     milestone animation (not the combo count) is what gets suppressed.
     A wrong answer resets the combo silently: no shake, no red flash. */
  if (burst && (combo === 3 || combo === 5 || combo === 8)) {
    el.classList.remove("burst"); void el.offsetWidth; el.classList.add("burst");
    spawnStars(el, 3);
  }
}

/* T4: one burst of warm confetti — 14 pieces (10 rounded rectangles +
   4 circles) from the top-center of the result screen. */
function fireConfetti() {
  /* Reduced motion keeps the confetti as a stationary fade (CSS calm
     keyframes), so the result celebration is visible on every device. */
  const layer = $("#fx-result"); if (!layer) return;
  const colors = ["#DFA32E", "#E9B949", "#C4632F", "#F2D492", "#FFFFFF"];
  for (let i = 0; i < 14; i++) {
    const p = document.createElement("span");
    const circle = i >= 10;
    p.className = "fx-confetti" + (circle ? " round" : "");
    if (circle) { p.style.width = "7px"; p.style.height = "7px"; }
    else { p.style.width = (5 + Math.round(Math.random())) + "px"; p.style.height = "11px"; }
    const dx = (Math.random() < 0.5 ? -1 : 1) * Math.round(40 + Math.random() * 85);
    const dy = Math.round(30 + Math.random() * 35);
    const rot = (Math.random() < 0.5 ? -1 : 1) * Math.round(45 + Math.random() * 105);
    p.style.setProperty("--dx", dx + "px");
    p.style.setProperty("--dy", dy + "px");
    p.style.setProperty("--rot", rot + "deg");
    p.style.background = colors[i % colors.length];
    layer.appendChild(p);
    p.addEventListener("animationend", () => p.remove());
    fxLater(() => p.remove(), 1100, "result");
  }
}

function renderResult(r) {

     350ms scale / opacity pop on display. */
  const numEl = document.querySelector(".r-score .num");
  if (numEl) {
    numEl.classList.remove("pop"); void numEl.offsetWidth;
    numEl.classList.add("pop");
  }
  /* T4 confetti gate: a full 10-question set that was either all-correct
     or produced at least one new mastery — once per session, never for
     the revenge return or the 5-question intro result. */
  const fromRevenge = resultFromRevenge; resultFromRevenge = false;
  if (!fromRevenge && !r.intro && r.total === 10 && (r.score === r.total || (r.newMastered || 0) >= 1)
      && r.sessionId && !confettiDone.has(r.sessionId)) {
    confettiDone.add(r.sessionId);

  $("#r-combo").textContent = r.bestCombo >= 2 ? "最高コンボ " + r.bestCombo : "";

/* Filters combine: skeleton chips AND the functional-group selector. */
const zukan = { skel: null, fg: null };
function stateChips(c) {
  const r = store.compounds[c.id];
  let chips = [];
  /* everCorrect / mastered are checked before `seen`: every record the
     quiz modes produce has seen=true whenever either flag is set, so this
     order is a no-op for them — but a pairing first-attempt correct sets
     everCorrect alone (its dedicated write path touches nothing else),
     and the zukan must still show the correct-experience chip for it. */
  if (r && r.mastered) chips.push({ label: "\u7fd2\u5f97\u3057\u305f", cls: "mastered" });
  else if (r && r.everCorrect) chips.push({ label: "\u6b63\u89e3\u3057\u305f", cls: "correct" });
  else if (!r || !r.seen) chips.push({ label: "\u672a\u767a\u898b", cls: "met" });
  else chips.push({ label: "\u51fa\u4f1a\u3063\u305f", cls: "seen" });
  if (r && r.needsReview) chips.push({ label: "\u8981\u5fa9\u7fd2", cls: "review" });

/* Dedicated record path: a pairing first-attempt correct flips ONLY the

/* ---------- session engine ---------- */
function pairSameOrder(a, b) {
  if (!a || !b || a.length !== b.length) return false;
  for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
  return true;
}
/* Fresh independent shuffle of both grids for every presentation. When
   this template was presented before (earlier board or earlier session),
   reject layouts that repeat the previous order of either grid, and
   prefer one that also moves every target to different cells; fall back
   gracefully (fixture approach, shared by both sub-modes). */
function pairLayoutFor(tpl, structsAll, namesAll, targets) {
  const prev = pairLastLayout[tpl.id];
  let best = null, layoutOnly = null, s = null, n = null;
  const sig = arr => targets.map(t => arr.indexOf(t)).sort((x, y) => x - y).join(",");
  for (let t = 0; t < 80 && !best; t++) {
    s = shuffle(structsAll);
    n = shuffle(namesAll);
    if (!prev) { best = { structs: s, names: n }; break; }
    if (pairSameOrder(s, prev.s) || pairSameOrder(n, prev.n)) continue;
    const moved = sig(s) !== sig(prev.s) && sig(n) !== sig(prev.n);
    if (moved) best = { structs: s, names: n };
    else if (!layoutOnly) layoutOnly = { structs: s, names: n };
  }
  const chosen = best || layoutOnly || { structs: s, names: n };
  pairLastLayout[tpl.id] = { s: chosen.structs.slice(), n: chosen.names.slice() };
  return chosen;
}
/* Session draw: no repeats; both categories ON splits as evenly as
   possible (5 boards -> 3+2 / 2+3, 10 boards -> 5+5). */
function pairBuildQueue() {
  const bank = pairBankFor(pairSettings.sub);
  const count = pairSettings.count;
  const ali = shuffle(bank.filter(p => p.category === "aliphatic"));
  const aro = shuffle(bank.filter(p => p.category === "aromatic"));
  let picks = [];
  if (pairCats.aliphatic && pairCats.aromatic) {
    let aN = count === 5 ? (Math.random() < 0.5 ? 3 : 2) : Math.ceil(count / 2);
    aN = Math.min(aN, ali.length);
    let bN = Math.min(count - aN, aro.length);
    aN = Math.min(count - bN, ali.length);   // top up from the other side, still no repeats
    picks = ali.slice(0, aN).concat(aro.slice(0, bN));
  } else if (pairCats.aliphatic) {
    picks = ali.slice(0, count);
  } else {
    picks = aro.slice(0, count);
  }
  return shuffle(picks);
}
function pairStartSession() {
  cleanupPairFx();

    sub: pairSettings.sub, count: pairSettings.count, queue: pairBuildQueue(),
    i: 0, results: [], score: 0, pairFirstTotal: 0, counted: false, fxDone: false
  };

}
function pairSetupBoard() {
  const tpl = pairSess.queue[pairSess.i];

    const lay = pairLayoutFor(tpl, [tpl.targetId].concat(tpl.structureDecoyIds), [tpl.targetId].concat(tpl.nameDecoyIds), [tpl.targetId]);
    pairQ = {
      p: tpl, structs: lay.structs, names: lay.names,
      selS: null, selN: null, attempt: 1, phase: "answer",
      prevS: null, prevN: null, result: null, fxDone: false, firstUnlock: false
    };
  } else {
    const lay = pairLayoutFor(tpl, tpl.targetIds.concat(tpl.structureDecoyIds), tpl.targetIds.concat(tpl.nameDecoyIds), tpl.targetIds);
    pairQ = {
      p: tpl, structs: lay.structs, names: lay.names,
      pairs: [null, null], pending: null, attempt: 1, phase: "answer",
      prevSet: null, result: null, pairMarks: null, newUnlocks: [], everAtStart: null
    };
    /* Round 13: snapshot each target's everCorrect at board start. The
       unlock note's newly-unlocked set is the diff of this snapshot
       against the record after the first-submission save — computed
       once at save time in pairJudge, never re-derived at render. */
    pairQ.everAtStart = {};
    tpl.targetIds.forEach(t => { pairQ.everAtStart[t] = !!recOf(t).everCorrect; });

}
function pairModeLabel() { return pairSess.sub === "two" ? "ツーペア" : "ワンペア"; }

/* ---------- question ---------- */
function pairSlotOf(side, id) {
  if (!pairQ || !pairQ.pairs) return -1;
  for (let i = 0; i < 2; i++) {
    const p = pairQ.pairs[i];
    if (p && p[side] === id) return i;
  }
  return -1;
}
function pairSetKey(pairs) {
  return pairs.filter(Boolean).map(p => p.s + "=" + p.n).sort().join("|");
}

      if (slot >= 0) { cls += slot === 0 ? " pairA" : " pairB"; dot = '<span class="p-dot ' + (slot === 0 ? "dotA" : "dotB") + '"></span>'; }
      else if (pairQ.pending && pairQ.pending.side === "n" && pairQ.pending.id === id) cls += pairQ.pairs[0] ? " pendB" : " sel";
    }
    b.className = cls;
    b.innerHTML = dot;

       count (pairSetKey is slot-order independent). */
    const both = pairQ.pairs[0] && pairQ.pairs[1];

function pairPick(kind, id) {

    else pairQ.selN = pairQ.selN === id ? null : id;

    const slot = pairSlotOf(kind, id);
    if (slot >= 0) { pairQ.pairs[slot] = null; pairQ.pending = null; }   // tap a colored card: unassign its whole pair
    else if (pairQ.pending && pairQ.pending.side === kind && pairQ.pending.id === id) { pairQ.pending = null; }
    else if (pairQ.pending && pairQ.pending.side !== kind) {
      const free = pairQ.pairs[0] ? 1 : 0;
      pairQ.pairs[free] = pairQ.pending.side === "s" ? { s: pairQ.pending.id, n: id } : { s: id, n: pairQ.pending.id };
      pairQ.pending = null;
    }

function pairJudge() {
  if (!pairQ || pairQ.phase !== "answer") return;
  let ok;

    const t = pairQ.p.targetId;
    ok = pairQ.selS === t && pairQ.selN === t;   // judged by compound ID, never by position
  } else {
    /* Snapshot the submitted assignment set BEFORE judging, so the
       settled screens can report per-pair outcomes. The snapshot is
       never surfaced during play or on the retry screen. */
    const snap = pairQ.pairs.filter(Boolean).map(p => ({ s: p.s, n: p.n }));
    if (pairQ.attempt === 1) {
      pairQ.sub1 = snap;
      /* RECORDS (two-pair, per-pair): everCorrect is saved NOW, at
         first-submission time, for each target whose canonical pair is
         in this submission. The save's display by-product (newUnlocks)
         is only read at settle time, so nothing about the save can leak
         into the retry screen. Retry-corrected pairs earn nothing: this
         block never runs on attempt 2. */
      pairQ.p.targetIds.forEach(t => {
        if (snap.some(p => p.s === t && p.n === t)) pairMarkEverCorrect(t);
      });
      /* Round 13: newly unlocked on THIS board = everCorrect false in
         the board-start snapshot, true after the save above. This set
         alone drives the BOOST first-unlock ring and the unlock note;
         it is computed here, at save time, not re-derived at render. */
      pairQ.newUnlocks = pairQ.p.targetIds.filter(t => pairQ.everAtStart && !pairQ.everAtStart[t] && !!recOf(t).everCorrect);
    } else {
      pairQ.sub2 = snap;
    }
    const want = pairQ.p.targetIds.map(t => t + "=" + t).sort().join("|");
    ok = pairSetKey(pairQ.pairs) === want;   // unordered set of canonical ID pairs; board score stays all-or-nothing
  }
  if (ok) pairSettle(pairQ.attempt === 1 ? "first" : "retry");
  else if (pairQ.attempt === 1) { pairQ.phase = "miss"; pairRenderQ(); }
  else pairSettle("revealed");
}
/* Per-pair outcome for two-pair boards, computed only at settle time:
   "first" = the canonical pair was in the FIRST submission,
   "retry" = it first appeared in the RETRY submission,
   "none"  = it was never submitted correctly. */
function pairPairOutcome(t) {
  const has = arr => !!arr && arr.some(p => p.s === t && p.n === t);
  if (has(pairQ.sub1)) return "first";
  if (has(pairQ.sub2)) return "retry";
  return "none";
}
function pairSettle(result) {
  pairQ.result = result;
  if (pairSess.sub === "two") {
    pairQ.pairMarks = {};
    pairQ.p.targetIds.forEach(t => {
      const m = pairPairOutcome(t);
      pairQ.pairMarks[t] = m;
      if (m === "first") pairSess.pairFirstTotal++;
    });
  } else {
    pairQ.firstUnlock = false;
    if (result === "first") pairQ.firstUnlock = pairMarkEverCorrect(pairQ.p.targetId);
  }
  if (result === "first") pairSess.score++;

$("#pq-retry").addEventListener("click", () => {

  if (mark !== "first" && mark !== "retry") return "";
  const first = mark === "first" && pairQ.newUnlocks.indexOf(id) >= 0;
  return boostHtml(note, first).replace('<span class="boost-tag', '<span class="bname">' + byId[id].nameJa + '</span><span class="boost-tag');
}
function pairRenderFb() {
  const p = pairQ.p;
  $("#pf-mode").textContent = pairModeLabel();
  $("#pf-prog").innerHTML = "<b>" + (pairSess.i + 1) + "</b> / " + pairSess.queue.length;
  const body = $("#pf-body");
  if (pairSess.sub === "one") {
    const target = byId[p.targetId];
    /* The target's real CHEM BOOST! panel once everCorrect stands (a
       first-attempt correct on this very board included); before that,
       the same locked frame the zukan shows — condition only. `first`
       (the first-unlock ring) is passed only when THIS answer flipped
       everCorrect false -> true. */
    const note = boostNote(p.targetId);
    let boostInner = "";
    if (note) boostInner = recOf(p.targetId).everCorrect ? boostHtml(note, pairQ.firstUnlock) : boostLockedHtml();
    body.innerHTML = pairCardHtml(p.targetId, false)
      + pairCmpHtml(p)
      + '<div id="pf-boost">' + boostInner + "</div>";
  } else {
    const bm = PAIR_BOARD_MARK[pairQ.result] || PAIR_BOARD_MARK.revealed;
    let boardTxt = bm[2];
    /* Round 14 praise (replaces the round-13 headers): ONE rule for
       every settled two-pair board, driven by the number of UNIQUE
       targets the player self-found correctly across the first
       submission and the retry. pairMarks already encodes exactly
       that per target: "first" = correct in submission 1, "retry" =
       first correct on the retry, "none" = never — so a target
       correct in both counts once, and no retry means an empty
       retry set. 1 unique -> ワンペアラッシュ！; 2 unique ->
       ツーペアラッシュ！！ in ALL cases: first-submission simultaneous
       (chip ✓), retry simultaneous (chip ◇), and split across
       submissions (chip —). 0 unique keeps the standard not-found
       header line above. The chip, scores, per-pair marks, records
       and BOOST are untouched: this is display text only. */
    if (pairQ.pairMarks) {
      const found = p.targetIds.filter(t => pairQ.pairMarks[t] === "first" || pairQ.pairMarks[t] === "retry").length;
      if (found === 1) boardTxt = "ワンペアラッシュ！";
      else if (found === 2) boardTxt = "ツーペアラッシュ！！";
    }
    body.innerHTML = '<div class="p-board-res"><span class="p-board-chip ' + bm[1] + '">' + bm[0] + '</span>'
      + '<span class="p-board-txt">' + boardTxt + "</span></div>"
      + '<div class="p-pairs-wrap" id="pf-pairswrap">'
      + pairCardHtml(p.targetIds[0], true, pairQ.pairMarks && pairQ.pairMarks[p.targetIds[0]])
      + pairCardHtml(p.targetIds[1], true, pairQ.pairMarks && pairQ.pairMarks[p.targetIds[1]])
      + "</div>"
      + pairCmpHtml(p)
      + '<div id="pf-boost">' + pairBoostPanelHtml(p.targetIds[0]) + pairBoostPanelHtml(p.targetIds[1]) + "</div>";
    pairFitBoostTwo(body);
  }
  $("#pf-next").textContent = pairSess.i >= pairSess.queue.length - 1 ? "結果を見る" : "次へ";
  pairFbFx();
}
/* Two-pair BOOST is best-effort: the visible (✓/◇) targets' blocks are
   shown in full when they fit the feedback area; if they cannot fit
   without scrolling, fall back to the one-line unlock note. The note
   is governed by the round-13 truthfulness rule: it names ONLY the
   compounds whose everCorrect flipped false -> true on this board's
   first submission (pairQ.newUnlocks, computed at save time). When
   nothing newly unlocked, no note is shown at all — even though BOOST
   panels were attempted above. */
function pairFitBoostTwo(body) {
  const wrap = body.querySelector("#pf-boost");
  if (!wrap) return;
  if (body.scrollHeight <= body.clientHeight + 1) return;
  const fresh = (pairQ.newUnlocks || []).filter(t => boostNote(t));
  if (fresh.length) {
    wrap.innerHTML = '<div class="boost-note-line">CHEM BOOST! ' + fresh.map(t => "<b>" + byId[t].nameJa + "</b>").join("と") + "の発展ポイントが開きました</div>";
  } else {
    wrap.innerHTML = "";
  }
}
function pairStarBurst(host) {
  if (!host) return;
  const pos = [[16, 10], [46, 4], [76, 10], [30, 20], [62, 20]];
  pos.forEach((xy, i) => {
    const s = document.createElement("span");
    s.className = "p-star";
    s.textContent = "★";
    s.style.left = xy[0] + "%";
    s.style.top = xy[1] + "px";
    s.style.fontSize = (11 + (i % 3) * 2) + "px";
    s.style.animationDelay = (i * 45) + "ms";
    host.appendChild(s);
    pairLater(() => s.remove(), 1000);
  });
}
function pairFbFx() {
  if (!pairQ || pairQ.fxDone || !pairQ.result) return;
  pairQ.fxDone = true;
  /* One-pair: the pair card celebrates. Two-pair: BOTH cards celebrate
     as ONE combined Phase-4 T1 event on their wrapper. A retry success
     uses the identical T1 in both sub-modes; under reduced motion the
     calm fade/glow variant replaces it (never full suppression).
     revealed: no effect. */
  const host = pairSess.sub === "two" ? $("#pf-pairswrap") : $("#pf-pair");
  if (!host) return;
  host.classList.remove("fx-bounce", "fx-ring", "calm-glow");
  if (pairQ.result === "first" || pairQ.result === "retry") {
    if (reducedMotion()) host.classList.add("calm-glow");
    else { host.classList.add("fx-bounce", "fx-ring"); pairStarBurst(host); }
  }
}
$("#pf-next").addEventListener("click", () => {
  if (!pairSess) return;
  if (pairSess.i < pairSess.queue.length - 1) {
    pairSess.i++;
    pairSetupBoard();
    show("scr-pair-q");
    pairRenderQ();
  } else {
    pairCompleteSession();
    pairRenderResults();
    show("scr-pair-res");
  }
});

/* ---------- results ---------- */
function pairFireConfetti() {
  /* Same pieces / calm treatment as the quiz result confetti, but in
     pairing's own layer; cleanupPairFx empties it on any exit so no
     piece can leak into the next session (the fixture's leak bug is
     not ported). Reduced motion: the shared confettiCalm keyframes
     keep it a gentle fade — never fully suppressed. */
  const layer = $("#fx-pair-res"); if (!layer) return;
  layer.innerHTML = "";
  const colors = ["#DFA32E", "#E9B949", "#C4632F", "#F2D492", "#FFFFFF"];
  for (let i = 0; i < 14; i++) {
    const pc = document.createElement("span");
    const circle = i >= 10;
    pc.className = "fx-confetti" + (circle ? " round" : "");
    if (circle) { pc.style.width = "7px"; pc.style.height = "7px"; }
    else { pc.style.width = (5 + Math.round(Math.random())) + "px"; pc.style.height = "11px"; }
    const dx = (Math.random() < 0.5 ? -1 : 1) * Math.round(40 + Math.random() * 85);
    const dy = Math.round(30 + Math.random() * 35);
    const rot = (Math.random() < 0.5 ? -1 : 1) * Math.round(45 + Math.random() * 105);
    pc.style.setProperty("--dx", dx + "px");
    pc.style.setProperty("--dy", dy + "px");
    pc.style.setProperty("--rot", rot + "deg");
    pc.style.background = colors[i % colors.length];
    layer.appendChild(pc);
    pc.addEventListener("animationend", () => pc.remove());
    pairLater(() => pc.remove(), 1100);
  }
}
function pairRenderResults() {
  $("#pr-score").textContent = pairSess.score;
  $("#pr-total").textContent = " / " + pairSess.queue.length;
  const marks = { first: "✓", retry: "◇", revealed: "—" };
  const box = $("#pr-marks"); box.innerHTML = "";
  pairSess.results.forEach(r => {
    const s = document.createElement("span");
    s.className = "p-mark m-" + r;
    s.textContent = marks[r];
    box.appendChild(s);
  });
  const two = pairSess.sub === "two";
  $("#pr-tally").hidden = !two;
  $("#pr-pair-legend").hidden = !two;
  if (two) $("#pr-tally").innerHTML = "ペア初回正解 <b>" + pairSess.pairFirstTotal + "</b> / " + (2 * pairSess.queue.length);
  /* Perfect run judged locally: score === total (either sub-mode,
     either length). Fires once per session; re-rendering this screen
     never replays it. */
  if (!pairSess.fxDone && pairSess.score === pairSess.queue.length) {
    pairSess.fxDone = true;
    pairFireConfetti();
  }
}
$("#pr-again").addEventListener("click", () => pairStartSession());
$("#pr-home").addEventListener("click", () => {
  cleanupPairFx();
  pairSess = null; pairQ = null;
  show("scr-home");
  refreshReviewBadge(); refreshWeekly();
});

/* ---------- exit navigation (round 9: no confirmation) ----------
   Pairing's back buttons behave exactly like the quiz modes' back
   button: return home immediately, from the question screen (including
   after a miss) and from the feedback screen alike. The in-progress
   session is discarded and never counted (pairCompleteSession is only
   reached from the last board's 次へ); everCorrect already earned in
   the session stays in the store. The results screen's ホームに戻る
   (#pr-home above) already worked the same way. No confirmation
   dialog exists anywhere in the app. */
function pairExitHome() {
  cleanupPairFx();
  pairSess = null; pairQ = null;
  show("scr-home");

}
