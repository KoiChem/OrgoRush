<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>オルゴラッシュ</title>
    <style>
      :root{
        --bg:#FFF8F1; --grid-line:rgba(166,110,58,.12); --card:#FFFFFF; --tile:#FFFDF8;
        --ink:#3B302C; --sub:#93755F; --line:#F0DFCB;
        --accent:#C4632F; --accent-ink:#FFFFFF;
        --amber:#DFA32E; --chip:#FBEEDC; --chip-on:#F6D9B8;
        --good:#7C5600; --good-bg:#F9ECCB; --good-border:#B97F06;
        /* pairing two-pair colors — the ONLY place pair colors are defined:
           pair 1 = honey/amber, pair 2 = azuki (dark values in the dark
           block below). Everything else references these variables. */
        --pair1-border:#B97F06; --pair1-bg:#F9ECCB; --pair1-dot:#B97F06;
        --pair2-border:#843F50; --pair2-bg:#F4E5E8; --pair2-soft:#F8ECEE; --pair2-dot:#843F50;
        /* two-pair settled feedback: a never-correct pair's card drops to
           plain paper with a thin muted sepia border (round 13). The card
           is light paper in both schemes, so one value serves both. */
        --pair-none-bg:#FFFDF8; --pair-none-border:#CDBFA9;
        --bad:#B93A32; --bad-bg:#FAE3E0;
        --boost-bg:#FFF6DE; --boost-line:#E3B95C;
        --story-bg:#FDF0E6; --story-line:#DFA07C;
        --shadow:0 2px 10px rgba(120,72,30,.10);
      }
      @media (prefers-color-scheme: dark){
        :root{
          --bg:#251A13; --grid-line:rgba(230,180,120,.10); --card:#33241A; --tile:#FFFDF8;
          --ink:#F6E9DA; --sub:#C6A78C; --line:#4C3524;
          --accent:#E08A5F; --accent-ink:#2A1A10;
          --amber:#E5B95C; --chip:#453122; --chip-on:#5F4128;
          --good:#F2CE7A; --good-bg:#4A3810; --good-border:#DFA32E;
          --pair1-border:#DFA32E; --pair1-bg:#4A3810; --pair1-dot:#DFA32E;
          --pair2-border:#DC93A2; --pair2-bg:#512D35; --pair2-soft:#42232A; --pair2-dot:#DC93A2;
          --bad:#F09A92; --bad-bg:#4C2A26;
          --boost-bg:#463712; --boost-line:#A87F22;
          --story-bg:#3D2A1C; --story-line:#8A5A3C;
          --shadow:0 2px 10px rgba(0,0,0,.35);
        }
      }
      *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
      html,body{height:100%;}
      body{
        margin:0; color:var(--ink);
        /* notebook grid: 22px squares, 1px warm sepia lines over the cream base (after IonicFormulaCompetition .play-active) */
        background:
          linear-gradient(var(--grid-line) 1px, transparent 1px) 0 0 / 22px 22px,
          linear-gradient(90deg, var(--grid-line) 1px, transparent 1px) 0 0 / 22px 22px,
          var(--bg);
        font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;
        overflow:hidden;
      }
      button{font:inherit; color:inherit; background:none; border:none; cursor:pointer;}
      button:disabled{cursor:default; opacity:.45;}

      .screen{display:none; height:100dvh; flex-direction:column; padding:10px 14px calc(10px + env(safe-area-inset-bottom)); max-width:560px; margin:0 auto; width:100%;}
      .screen.on{display:flex;}

      /* ---------- HOME ---------- */
      #scr-home{overflow-y:auto;}
      .ttl{font-size:37px; font-weight:900; letter-spacing:-.035em; margin:6px 0 0; text-align:center;}
      .ttl .orgo{color:var(--accent);}
      .ttl .rush{position:relative; display:inline-block;}
      .ttl .swoosh{position:absolute; left:1px; bottom:-3px; width:calc(100% - 2px); height:5px; color:var(--amber); pointer-events:none;}
      .tagline{text-align:center; color:var(--sub); font-size:14px; margin:2px 0 8px; font-weight:600;}
      .grp{margin-bottom:8px;}
      .seg{display:flex; gap:6px;}
      .seg button{
        flex:1; min-height:44px; border-radius:12px; background:var(--chip);
        font-weight:700; font-size:14px; padding:6px 4px; border:2px solid transparent;
        display:flex; align-items:center; justify-content:center; gap:5px; line-height:1.25;
      }
      .seg button.on{background:var(--chip-on); border-color:var(--accent);}
      .seg button .cnt{background:var(--accent); color:var(--accent-ink); border-radius:999px; font-size:12px; padding:1px 7px; font-weight:800;}
      #dir-seg button{font-size:12.5px; padding:6px 2px; white-space:nowrap; min-width:0;}
      #dir-seg button.mode-na{opacity:.38;}
      @media (max-width:360px){
        .screen{padding-left:10px; padding-right:10px;}
        #dir-seg{gap:4px;}
        #dir-seg button{font-size:11px; padding:6px 1px; letter-spacing:-.02em;}
        #diff-seg{gap:4px;}
        #diff-seg button{font-size:12.5px; padding:6px 2px; min-width:0;}
        #mode-seg{gap:5px;}
        #mode-seg button{font-size:11.5px; padding-left:2px; padding-right:2px; min-width:0;}
      }
      .home-notice{margin:8px 0 0; background:var(--bad-bg); color:var(--bad); border:2px solid var(--bad); border-radius:12px; padding:9px 12px; font-size:13.5px; font-weight:700; text-align:center; line-height:1.5;}
      /* mode selector: schematic icons show the format difference */
      #mode-seg{gap:8px;}
      #mode-seg button{position:relative; flex-direction:column; gap:3px; min-height:66px; padding:7px 3px 6px; border-radius:14px; font-size:12.5px; line-height:1.2;}
      #mode-seg .mode-ico{width:32px; height:24px; flex:none; color:var(--sub);}
      #mode-seg button.on .mode-ico{color:var(--accent);}
      #mode-seg button .cnt{position:absolute; top:5px; right:5px;}
      .q-mode{flex:none; display:flex; align-items:center; gap:3px; font-size:11px; font-weight:800; color:var(--accent); background:var(--chip); border-radius:999px; padding:4px 8px; white-space:nowrap;}
      .q-mode svg{width:18px; height:14px; flex:none;}
      .chips{display:flex; flex-wrap:wrap; gap:6px;}
      .chips button{
        min-height:40px; border-radius:999px; background:var(--chip); padding:6px 13px;
        font-weight:700; font-size:13.5px; border:2px solid transparent;
      }
      .chips button.on{background:var(--chip-on); border-color:var(--accent);}
      /* unit toggle cards (home range) */
      .unit-grid{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
      .unit-card{
        min-height:54px; border-radius:12px; background:var(--chip); border:2px solid transparent;
        padding:7px 9px; display:flex; align-items:center; gap:7px; text-align:left; font-weight:700;
      }
      .unit-card .u-check{
        width:21px; height:21px; flex:none; border-radius:50%; border:2px solid var(--line);
        background:var(--card); color:transparent; display:flex; align-items:center; justify-content:center;
        font-size:12px; font-weight:900; line-height:1;
      }
      .unit-card .u-name{flex:1; font-size:13.5px; line-height:1.25;}
      .unit-card .u-name small{display:block; font-size:11.5px; color:var(--sub); font-weight:800; margin-top:1px;}
      .unit-card.on{border-color:var(--accent); background:var(--chip-on);}
      .unit-card.on .u-check{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
      .unit-card:not(.on) .u-name{color:var(--sub);}
      /* zukan functional-group selector */
      .fg-toggle{
        width:100%; min-height:44px; border-radius:12px; border:2px solid var(--line);
        background:var(--card); color:var(--ink); font-weight:700; font-size:14px; padding:6px 12px;
        display:flex; align-items:center; justify-content:space-between; gap:8px;
      }
      .fg-toggle.on{border-color:var(--accent); background:var(--chip);}
      .fg-toggle .fg-caret{color:var(--sub); font-size:12px; flex:none; transition:transform .15s;}
      .fg-toggle[aria-expanded="true"] .fg-caret{transform:rotate(180deg);}
      .fg-panel{margin-top:6px;}
      .fg-chips{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
      .fg-chips button{
        min-height:40px; border-radius:12px; background:var(--chip); padding:6px 10px;
        font-weight:700; font-size:13px; border:2px solid transparent; text-align:left;
        display:flex; align-items:center; justify-content:space-between; gap:6px;
      }
      .fg-chips button .cnt{font-size:11.5px; color:var(--sub); font-weight:800; flex:none;}
      .fg-chips button.on{background:var(--chip-on); border-color:var(--accent);}
      .fg-chips button.zero{opacity:.38;}
      .start-btn{
        margin-top:auto; width:100%; min-height:58px; border-radius:16px;
        background:var(--accent); color:var(--accent-ink); font-size:19px; font-weight:800;
        box-shadow:var(--shadow); letter-spacing:.04em;
      }
      .start-btn:active{transform:scale(.985);}
      .foot-note{font-size:11px; color:var(--sub); text-align:center; margin:8px 0 0; line-height:1.5;}

      /* ---------- QUIZ ---------- */
      #scr-quiz{overflow:hidden;}
      .q-head{flex:none; height:46px; display:flex; align-items:center; gap:10px;}
      .q-back{width:40px; height:40px; border-radius:12px; background:var(--chip); font-size:18px; font-weight:800; flex:none;}
      .q-prog{flex:1; display:flex; align-items:center; gap:8px;}
      .q-bar{flex:1; height:8px; border-radius:99px; background:var(--chip); overflow:hidden;}
      .q-bar i{display:block; height:100%; background:var(--amber); border-radius:99px; transition:width .25s;}
      .q-count{font-weight:800; font-size:14px; min-width:38px; text-align:right;}
      .q-combo{flex:none; min-width:64px; text-align:center; font-weight:800; font-size:13px; color:var(--accent); background:var(--chip); border-radius:999px; padding:5px 8px; visibility:hidden;}
      .q-combo.show{visibility:visible;}
      /* T5 combo milestone: 3 / 5 / 8 — transform only */
      .q-combo.burst{animation:burst .35s ease;}
      @keyframes burst{0%{transform:scale(1)}45%{transform:scale(1.18)}100%{transform:scale(1)}}
      /* T3 newly-mastered chip: temporarily replaces the combo label in the
         same header slot (no new row), then the combo label returns */
      .q-combo.mastered{background:var(--amber); color:#3B2A05;}
      .q-combo.mpop{animation:masteredPop .65s ease;}
      @keyframes masteredPop{0%{transform:scale(.75)}45%{transform:scale(1.12)}100%{transform:scale(1)}}
      @media (prefers-reduced-motion: reduce){ .q-bar i{transition:none;} }

      /* overflow hidden + shrinkable children: on short viewports the
         question area compresses inside its own frame instead of
         spilling over the header / choices (the old centered overflow
         painted the direction label over the progress bar and slid the
         hint chip under the choices card in mobile Safari). */
      .q-main{flex:1 1 auto; min-height:0; overflow:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; padding:4px 0;}
      .q-name{font-size:30px; font-weight:800; text-align:center; line-height:1.3; word-break:keep-all; min-height:0; flex:0 1 auto; overflow:hidden;}
      .q-formula{font-size:16px; color:var(--sub); font-weight:700; flex:none;}
      .q-struct{
        background:var(--tile); border:2px solid var(--line); border-radius:16px;
        width:min(78vw,300px); height:min(30dvh,190px); min-height:0; flex:0 1 auto;
        display:flex; align-items:center; justify-content:center; padding:10px;
      }
      .q-struct img{max-width:100%; max-height:100%; object-fit:contain;}
      .q-props{
        background:var(--card); border:2px solid var(--line); border-radius:16px; box-shadow:var(--shadow);
        width:100%; max-height:100%; min-height:0; overflow-y:auto; padding:16px; font-size:17px; line-height:1.65; font-weight:600;
      }
      /* The hint is its own row inside the question frame: fully rendered
         when present, and the row collapses entirely when there is no
         hint (no reserved blank, no overlap with the choices card). */
      .q-hint{flex:none; font-size:13px; font-weight:800; color:var(--accent); background:var(--chip); border-radius:999px; padding:4px 12px; display:none; max-width:100%; text-align:center;}
      .q-hint.show{display:block;}

      .q-choices{flex:none; height:min(27dvh,224px); display:grid; gap:8px;}
      .q-choices.c4{grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr;}
      .q-choices.c2{grid-template-columns:1fr 1fr; grid-template-rows:1fr;}
      .choice{
        background:var(--card); border:2px solid var(--line); border-radius:16px; box-shadow:var(--shadow);
        display:flex; align-items:center; justify-content:center; padding:8px; position:relative;
        font-size:17px; font-weight:800; line-height:1.3; text-align:center; min-height:0; overflow:hidden;
      }
      .choice img{max-width:92%; max-height:92%; object-fit:contain; pointer-events:none;}
      .choice .mark{position:absolute; top:6px; right:9px; font-size:17px; font-weight:900;}
      .choice.right{border-color:var(--good-border); background:var(--good-bg);}
      .choice.right .mark{color:var(--good);}
      .choice.wrong{border-color:var(--bad); background:var(--bad-bg);}
      .choice.wrong .mark{color:var(--bad);}
      .choice.dim{opacity:.55;}
      /* T1 correct-answer bounce: transform only, layout never moves */
      .choice.pop{animation:choicePop .38s ease;}
      @keyframes choicePop{0%{transform:scale(1)}35%{transform:scale(1.08); box-shadow:0 0 0 3px rgba(223,163,46,.55), 0 4px 16px rgba(185,127,6,.35);}70%{transform:scale(.99)}100%{transform:scale(1)}}

      /* ---------- Phase 4 decorative FX layer ----------
         Stars / confetti live only in these layers: absolutely positioned,
         pointer-events none, transform + opacity animation only. They are
         placed around elements, never over body text. */
      #scr-quiz, #scr-result{position:relative;}
      .fx-layer{position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:8;}
      /* Result confetti is clipped to the top band of the result screen
         (score area only): the layer ends above the miss list, so no
         piece can ever drift into it. */
      #fx-result{bottom:auto; height:140px;}
      .fx-star{
        position:absolute; pointer-events:none; opacity:0;
        clip-path:polygon(50% 0, 63% 37%, 100% 50%, 63% 63%, 50% 100%, 37% 63%, 0 50%, 37% 37%);
        animation:starFly .62s ease-out both;
      }
      @keyframes starFly{
        0%{opacity:0; transform:translate(-50%,-50%) scale(.4) rotate(0deg);}
        22%{opacity:1;}
        100%{opacity:0; transform:translate(calc(-50% + var(--dx,0px)), calc(-50% + var(--dy,0px))) scale(1.15) rotate(45deg);}
      }
      /* T4 result confetti: warm pieces from the top-center of the result
         screen, falling at most ~65px inside the clipped top band of
         #fx-result, so they never reach the miss list or the buttons */
      .fx-confetti{
        position:absolute; left:50%; top:64px; pointer-events:none; opacity:0;
        border-radius:2px; animation:confettiFall .8s ease-out both;
      }
      .fx-confetti.round{border-radius:50%;}
      @keyframes confettiFall{
        0%{opacity:0; transform:translate(0,0) rotate(0deg);}
        12%{opacity:1;}
        75%{opacity:1;}
        100%{opacity:0; transform:translate(var(--dx,0px), var(--dy,120px)) rotate(var(--rot,90deg));}
      }
      /* T4 score pop: the number itself is set instantly; only a pop plays */
      .r-score .num.pop{animation:scorePop .35s ease;}
      @keyframes scorePop{0%{transform:scale(.88); opacity:.5;} 55%{transform:scale(1.06); opacity:1;} 100%{transform:scale(1); opacity:1;}}
      /* Reduced motion: never a total blackout. Movement, travel and
         rotation are dropped, but the celebration still shows as a gentle
         opacity / glow fade, so a correct answer never passes in silence
         on devices with the reduce-motion setting on. */
      @media (prefers-reduced-motion: reduce){
        .choice.pop{animation:choiceCalm .5s ease;}
        .fx-star{animation:starCalm .65s ease-out both;}
        .fx-confetti{animation:confettiCalm .85s ease-out both;}
        .r-score .num.pop{animation:scoreCalm .35s ease;}
        .q-combo.burst{animation:comboCalm .35s ease;}
        .q-combo.mpop{animation:comboCalm .5s ease;}
      }
      @keyframes choiceCalm{0%{box-shadow:var(--shadow);}40%{box-shadow:0 0 0 3px rgba(223,163,46,.65), 0 4px 14px rgba(185,127,6,.30);}100%{box-shadow:var(--shadow);}}
      @keyframes starCalm{0%{opacity:0;}25%{opacity:1;}100%{opacity:0;}}
      @keyframes confettiCalm{0%{opacity:0;}20%{opacity:1;}80%{opacity:1;}100%{opacity:0;}}
      @keyframes scoreCalm{0%{opacity:.5;}100%{opacity:1;}}
      @keyframes comboCalm{0%{opacity:.35;}100%{opacity:1;}}

      /* One fixed height in BOTH states: the dashed placeholder frame is
         already exactly as tall as the answered frame, so revealing the
         feedback never moves anything. The height fits the largest
         possible content with no internal scrolling and nothing clipped:
         correct title + properties (max 33 chars) + CHEM BOOST! header
         and full text (max 70 chars), or the wrong-answer layout
         (correct-answer line + structure comparison + rival note, max
         55 chars). Shorter viewports use the shared smaller sizes in the
         max-height breakpoints below — again identical in both states. */
      .q-feedback{
        flex:none; height:216px; margin-top:8px;
        border-radius:16px; border:2px dashed var(--line); padding:8px 11px; overflow-y:auto;
        font-size:14px; line-height:1.5;
      }
      .q-feedback.ok{border:2px solid var(--good-border); background:var(--good-bg);}
      .q-feedback.ng{border:2px solid var(--bad); background:var(--bad-bg);}
      .fb-title{font-weight:900; font-size:15px; margin-bottom:2px;}
      .fb-title .ok{color:var(--good);} .fb-title .ng{color:var(--bad);}
      .fb-vs{display:flex; gap:10px; margin:4px 0 2px;}
      .fb-vs figure{margin:0; flex:1; text-align:center;}
      .fb-vs .tile{background:var(--tile); border:1.5px solid var(--line); border-radius:10px; height:46px; display:flex; align-items:center; justify-content:center; padding:4px;}
      .fb-vs img{max-width:100%; max-height:100%; object-fit:contain;}
      .fb-vs figcaption{font-size:11.5px; font-weight:700; margin-top:2px;}
      .fb-rival{margin-top:4px; font-weight:600;}
      .fb-rival b{color:var(--accent);}

      /* ---------- CHEM BOOST! ---------- */
      .boost{
        position:relative;
        margin-top:6px; border:1.5px solid var(--boost-line); border-radius:10px;
        background:var(--boost-bg); padding:6px 9px 7px; text-align:left;
      }
      .boost-head{display:flex; align-items:center; gap:7px;}
      .boost-title{font-size:11.5px; font-weight:900; letter-spacing:.1em; color:var(--good); white-space:nowrap;}
      .boost-tag{
        font-size:10.5px; font-weight:800; line-height:1.5; border-radius:999px; padding:1px 8px; white-space:nowrap;
        background:var(--tag-bg); color:var(--tag-ink);
      }
      .boost-tag.t-struct{--tag-bg:#DCE9F7; --tag-ink:#2F5B8F;}
      .boost-tag.t-react{--tag-bg:#FBE3D3; --tag-ink:#9A4E1E;}
      .boost-tag.t-disc{--tag-bg:#DDEEDD; --tag-ink:#2F6B3A;}
      .boost-tag.t-exam{--tag-bg:#E7DFF5; --tag-ink:#5E4396;}
      @media (prefers-color-scheme: dark){
        .boost-tag.t-struct{--tag-bg:#2C4258; --tag-ink:#A9CBEF;}
        .boost-tag.t-react{--tag-bg:#57381F; --tag-ink:#F0B98A;}
        .boost-tag.t-disc{--tag-bg:#2C4A2E; --tag-ink:#A5D6A7;}
        .boost-tag.t-exam{--tag-bg:#413259; --tag-ink:#C9B3EE;}
      }
      .boost-text{margin:3px 0 0; font-size:12.8px; line-height:1.42; font-weight:600; color:var(--ink);}
      .boost.locked{border-style:dashed; background:transparent; border-color:var(--line);}
      .boost.locked .boost-title{color:var(--sub);}
      .boost-lock-ico{width:14px; height:14px; flex:none; color:var(--sub);}
      .boost-locked-text{margin:3px 0 0; font-size:12.5px; line-height:1.5; font-weight:600; color:var(--sub);}
      .d-boost{margin-top:8px;}
      /* ---------- CHEM STORY (zukan detail only) ---------- */
      .story{
        margin-top:10px; border:1.5px solid var(--story-line); border-radius:12px;
        background:var(--story-bg); padding:10px 12px 12px; text-align:left;
      }
      .story-head{display:flex; align-items:center; gap:7px; flex-wrap:wrap;}
      .story-title{font-size:11.5px; font-weight:900; letter-spacing:.1em; color:var(--accent); white-space:nowrap;}
      .story-tag{
        font-size:10.5px; font-weight:800; line-height:1.5; border-radius:999px; padding:1px 8px; white-space:nowrap;
        background:var(--chip-on); color:var(--accent);
      }
      .story-name{margin:7px 0 0; font-size:15.5px; font-weight:800; line-height:1.45;}
      .story-body{margin:7px 0 0; font-size:13.5px; line-height:1.8; font-weight:500; color:var(--ink);}
      .story.locked{border-style:dashed; background:transparent; border-color:var(--line);}
      .story.locked .story-title{color:var(--sub);}
      .story-locked-text{margin:3px 0 0; font-size:12.5px; line-height:1.5; font-weight:600; color:var(--sub);}
      /* T2 first-unlock glow: a decorative ring layer on the panel's outer
         frame only (opacity 0→1→0, starts 120ms after T1). No opaque color
         is ever laid over the CHEM BOOST! text itself. */
      .boost.first::after{
        content:""; position:absolute; inset:-3px; border-radius:13px; pointer-events:none;
        border:2px solid rgba(223,163,46,.85);
        box-shadow:0 0 14px 2px rgba(223,163,46,.55), inset 0 0 8px rgba(223,163,46,.30);
        opacity:0; animation:boostRing .5s ease .12s both;
      }
      @keyframes boostRing{ 0%{opacity:0;} 35%{opacity:1;} 100%{opacity:0;} }
      /* The BOOST ring is a pure opacity fade (no movement), so it also
         plays under reduced motion — see the calm keyframes above. */
      /* BOOST entrance (quiz feedback only — the zukan detail panel keeps
         its static reading layout): every time the panel appears in the
         correct-answer feedback it fades/rises in over 380ms, transform +
         opacity only. The panel's space is reserved from the start and
         the full text is in the DOM from frame one, so nothing is ever
         clipped or scrolled while it animates. On a first unlock the T2
         ring above stacks on top of this entrance. */
      #q-feedback .boost{animation:boostEnter .38s ease-out both;}
      @keyframes boostEnter{ 0%{opacity:0; transform:translateY(6px);} 100%{opacity:1; transform:translateY(0);} }
      /* Header shine: a pale amber light sweeps once across the header
         row's background layer. The layer sits behind the title and tag
         chip (z-index 0 vs 1) and is translucent, so no opaque color ever
         covers the text. */
      #q-feedback .boost-head{position:relative; overflow:hidden;}
      #q-feedback .boost-head>*{position:relative; z-index:1;}
      #q-feedback .boost-head::before{
        content:""; position:absolute; inset:0; z-index:0; pointer-events:none;
        background:linear-gradient(100deg, transparent 25%, rgba(223,163,46,.30) 50%, transparent 75%);
        transform:translateX(-110%);
        animation:boostShine .8s ease .12s both;
      }
      @keyframes boostShine{ 0%{transform:translateX(-110%);} 100%{transform:translateX(110%);} }
      /* Reduced motion: no rise and no shine — only a gentle opacity
         fade, matching the calm treatment of the other Phase 4 effects.
         The entrance is pure CSS on an element rebuilt with each
         feedback render, so no timers or leftover nodes can survive a
         screen change or a fast tap-through. */
      @media (prefers-reduced-motion: reduce){
        #q-feedback .boost{animation:boostEnterCalm .55s ease both;}
        #q-feedback .boost-head::before{animation:none; opacity:0;}
      }
      @keyframes boostEnterCalm{ 0%{opacity:0;} 100%{opacity:1;} }
      /* Short viewports (e.g. the public page inside mobile Safari, where
         page chrome eats into the height): shrink the structure area,
         choices and the feedback frame instead of letting anything
         overlap. These sizes apply identically before and after answering
         — the state transition itself never changes a dimension. The
         no-scroll rule is kept: the feedback frame stays tall enough for
         its largest content at these sizes too (its inner text steps
         down slightly to make that possible), and the remaining space
         comes out of the flexible question area. */
      @media (max-height:700px){
        .q-struct{height:min(20dvh,170px);}
        .q-choices{height:min(25dvh,208px);}
        .q-feedback{height:206px;}
        .boost-text{font-size:12.5px; line-height:1.4;}
      }
      @media (max-height:560px){
        .screen{padding-top:8px; padding-bottom:calc(8px + env(safe-area-inset-bottom));}
        .q-head{height:40px;}
        .q-main{gap:5px; padding:2px 0;}
        .q-name{font-size:26px;}
        .q-struct{height:min(17dvh,120px); padding:6px;}
        .q-choices{height:min(23dvh,175px); gap:6px;}
        .q-feedback{height:200px; margin-top:6px; font-size:13.5px;}
        .fb-vs .tile{height:40px;}
        .boost-text{font-size:12.2px; line-height:1.38;}
        .q-foot{height:54px; padding-top:6px;}
        .next-btn{height:46px;}
      }
      /* Layout invariant: there are deliberately NO answered-state size
         overrides. The question card, the structure frame, the choice
         cards and the feedback frame keep the exact same position and
         size before and after answering; only the feedback frame's
         contents, the choice markings and the Next button's visibility
         change. (The JS still toggles an .answered class on #scr-quiz,
         but no layout rule keys off it.) */

      .q-foot{flex:none; height:60px; display:flex; align-items:center; padding-top:8px;}
      .next-btn{
        width:100%; height:50px; border-radius:14px; background:var(--accent); color:var(--accent-ink);
        font-size:17px; font-weight:800; visibility:hidden;
      }
      .next-btn.show{visibility:visible;}

      .zukan-btn{
        margin-top:8px; width:100%; min-height:50px; border-radius:14px;
        background:var(--chip); color:var(--ink); font-size:16px; font-weight:800; border:2px solid var(--line);
      }
      /* ---------- ZUKAN ---------- */
      #scr-zukan, #scr-detail{overflow:hidden;}
      .z-head{flex:none; display:flex; align-items:center; gap:10px; height:46px;}
      .z-title{font-size:20px; font-weight:900; flex:1; white-space:nowrap;}
      .z-count{font-weight:800; font-size:13px; color:var(--accent); background:var(--chip); border-radius:999px; padding:5px 10px; white-space:nowrap;}
      .z-counts{display:flex; gap:8px; align-items:center; flex:none;}
      @media (max-width:480px){
        #scr-zukan .z-head{flex-wrap:wrap; height:auto; min-height:46px; row-gap:6px; padding:2px 0 4px;}
        #scr-zukan .z-counts{flex-basis:100%;}
      }
      .z-grid{flex:1 1 auto; min-height:0; overflow-y:auto; display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:2px 0 12px; align-content:start; grid-auto-rows:min-content;}
      .z-card{background:var(--card); border:2px solid var(--line); border-radius:14px; padding:8px 8px 9px; text-align:left; display:flex; flex-direction:column; gap:4px; min-height:152px; position:relative; overflow:hidden;}
      .z-card .tile{background:var(--tile); border:1.5px solid var(--line); border-radius:10px; height:52px; flex:none; display:flex; align-items:center; justify-content:center; padding:4px;}
      .z-card .tile img{max-width:100%; max-height:100%; object-fit:contain;}
      .z-name{font-weight:800; font-size:14.5px; line-height:1.25;}
      .z-formula{font-size:12.5px; color:var(--sub); font-weight:700;}
      .z-chips{display:flex; flex-wrap:wrap; gap:4px; margin-top:auto; flex:none; width:100%; min-height:21px; align-items:center; position:relative; z-index:2; padding-top:3px;}
      .z-chip{font-size:11px; font-weight:800; border-radius:999px; padding:2px 7px; background:var(--chip); color:var(--sub); flex:none; white-space:nowrap; line-height:1.5;}
      .z-chip.met{background:#EDEBE6; color:#6B6259;}
      .z-chip.correct{background:var(--good-bg); color:var(--good);}
      .z-chip.mastered{background:var(--amber); color:#3B2A05; border:1.5px solid #B97F0E;}
      .z-chip.review{background:var(--bad-bg); color:var(--bad);}
      .z-chip.seen{background:var(--chip-on); color:var(--ink);}
      .week-bar{flex:none; display:flex; align-items:center; gap:7px; background:var(--chip); border:2px solid var(--line); border-radius:999px; padding:6px 12px; margin-top:8px; font-size:12.5px; font-weight:800;}
      .week-bar .wk-label{color:var(--sub); font-size:11.5px; letter-spacing:.06em;}
      .week-dots{display:flex; gap:4px; align-items:center;}
      .week-dots i{width:10px; height:10px; border-radius:50%; background:var(--card); border:2px solid var(--amber); display:block;}
      .week-dots i.fill{background:var(--amber);}
      .week-bar .wk-done{background:var(--amber); color:#3B2A05; border-radius:999px; padding:1px 8px; font-size:11px;}
      .week-bar .wk-total{margin-left:auto; color:var(--sub); font-weight:700; font-size:12px;}
      .r-stats{text-align:center; font-weight:800; font-size:13.5px; color:var(--accent); min-height:20px; margin-top:2px;}
      .r-stats:empty{min-height:20px;}
      .d-main{flex:1 1 auto; min-height:0; overflow-y:auto; padding:4px 0 10px;}
      .d-struct{background:var(--tile); border:2px solid var(--line); border-radius:16px; height:200px; display:flex; align-items:center; justify-content:center; padding:14px; margin-bottom:10px;}
      .d-struct img{max-width:100%; max-height:100%; object-fit:contain;}
      .d-name{font-size:26px; font-weight:900; line-height:1.3;}
      .d-meta{font-size:14px; color:var(--sub); font-weight:700; line-height:1.7;}
      .d-props{background:var(--card); border:2px solid var(--line); border-radius:14px; padding:12px 14px; font-size:15.5px; line-height:1.7; font-weight:600; margin-top:8px;}
      /* ---------- RESULTS ---------- */
      #scr-result{overflow:hidden;}
      .r-score{text-align:center; margin:8px 0 2px;}
      .r-score .num{font-size:52px; font-weight:900; line-height:1.1;}
      .r-score .num span{font-size:24px; color:var(--sub);}
      .r-combo{text-align:center; color:var(--accent); font-weight:800; font-size:14px; min-height:20px;}
      .r-miss-label{font-size:12px; font-weight:700; color:var(--sub); margin:10px 2px 5px;}
      .r-miss{flex:1 1 auto; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:6px;}
      .r-miss .row{
        display:flex; align-items:center; gap:10px; background:var(--card); border:2px solid var(--line);
        border-radius:12px; padding:6px 10px; font-weight:700; font-size:15px;
      }
      .r-miss .row .tile{background:var(--tile); border:1.5px solid var(--line); border-radius:8px; width:52px; height:38px; flex:none; display:flex; align-items:center; justify-content:center; padding:3px;}
      .r-miss .row img{max-width:100%; max-height:100%; object-fit:contain;}
      .r-miss .none{color:var(--sub); font-weight:600; text-align:center; padding:14px 0;}
      .r-btns{flex:none; display:grid; grid-template-columns:1fr 1fr; gap:8px; padding-top:10px;}
      .r-btns button{min-height:50px; border-radius:14px; font-weight:800; font-size:15px; background:var(--chip);}
      .r-btns button.primary{background:var(--accent); color:var(--accent-ink); grid-column:1 / -1;}
      .r-btns button.wide{grid-column:1 / -1;}

      /* ---------- HOME grouping (pairing integration tidy-up) ---------- */
      .grp-label{font-size:11.5px; font-weight:800; color:var(--sub); letter-spacing:.08em; margin:0 2px 5px;}
      /* mode entries: 2x2 grid so all four entries stay uniform with room
         for the long ペアリングラッシュ label */
      #mode-seg{display:grid; grid-template-columns:1fr 1fr; gap:8px;}

      /* ---------- PAIRING RUSH ---------- */
      #scr-pair-start, #scr-pair-q, #scr-pair-fb, #scr-pair-res{overflow:hidden; position:relative;}
      .p-head{flex:none; height:46px; display:flex; align-items:center; gap:10px;}
      .p-title{font-size:20px; font-weight:900; white-space:nowrap;}
      .p-prog{margin-left:auto; font-weight:800; font-size:14px; color:var(--sub); white-space:nowrap;}
      .p-prog b{color:var(--accent); font-size:16px;}
      /* start screen */
      .p-start-wrap{flex:1 1 auto; display:flex; flex-direction:column; justify-content:center; gap:14px; max-width:440px; width:100%; margin:0 auto;}
      .p-cats{display:flex; gap:10px;}
      .p-cat{
        flex:1; min-height:58px; border-radius:14px; background:var(--card); border:2.5px solid var(--line);
        box-shadow:var(--shadow); display:flex; align-items:center; justify-content:center; gap:7px;
        font-size:17px; font-weight:800; color:var(--sub); padding:10px 6px;
      }
      .p-cat .u-check{
        width:22px; height:22px; flex:none; border-radius:50%; border:2px solid var(--line);
        background:var(--card); color:transparent; display:flex; align-items:center; justify-content:center;
        font-size:12px; font-weight:900; line-height:1;
      }
      .p-cat .cnt{font-size:12px; font-weight:800; color:var(--sub);}
      .p-cat.on{border-color:var(--amber); background:var(--chip-on); color:var(--ink);}
      .p-cat.on .u-check{background:var(--amber); border-color:var(--amber); color:#3B2A05;}
      .p-start-btn{
        width:100%; min-height:58px; border-radius:16px; background:var(--accent); color:var(--accent-ink);
        font-size:19px; font-weight:800; box-shadow:var(--shadow); letter-spacing:.04em;
      }
      .p-start-btn:active{transform:scale(.985);}
      .p-start-btn:disabled{background:var(--chip); color:var(--sub); box-shadow:none; opacity:1;}
      /* start screen segmented controls (sub-mode / session length):
         no text labels anywhere — controls and toggles only */
      #ps-seg-sub button, #ps-seg-count button{min-height:48px; font-size:15px; font-weight:800;}
      .p-start-msg{border:2px dashed var(--amber); background:var(--chip); color:var(--accent);
        border-radius:14px; padding:12px 14px; font-size:14.5px; font-weight:700; line-height:1.55; text-align:center; margin:0;}
      /* question board */
      .p-grid-s{flex:1.6 1 0; min-height:0; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:8px;}
      /* name rows + tall right-side confirm share one row. Grow ratio
         1.6 : 1 against the structure grid keeps the name rows moderate
         (~60px each at 390x650, above the ~56px tappable floor) and
         hands every pixel they give up to the structure cards. */
      .p-name-row{flex:1 1 60px; min-height:0; display:flex; gap:9px; margin-top:8px;}
      .p-grid-n{flex:1 1 auto; min-width:0; min-height:0; display:grid; grid-template-columns:1fr; grid-template-rows:repeat(4, 1fr); gap:6px;}
      .p-card{
        position:relative; border:2.5px solid var(--line); border-radius:16px; box-shadow:var(--shadow);
        display:flex; align-items:center; justify-content:center; padding:8px; min-height:0; overflow:hidden;
        text-align:center; width:100%;
      }
      .p-card.struct{background:var(--tile); color:#221608;}
      .p-card.name{background:var(--card); color:var(--ink);}
      .p-card img{max-width:92%; max-height:92%; object-fit:contain; pointer-events:none;}
      .p-card.sel{border-color:var(--amber); background:#FBEED3; box-shadow:0 0 0 2px var(--amber), var(--shadow);}
      .p-card.name.sel{color:#4A2E08;}
      /* two-pair pair distinction BY COLOR (question board only): pair
         slot 1 wears --pair1-*, pair slot 2 wears --pair2-*; a half-formed
         (pending) card wears its future slot's color — slot 1 via .sel
         above, slot 2 with the lighter --pair2-soft tint. A small solid
         dot in the pair color sits at each assigned card's top-left;
         there are NO number badges. */
      .p-card.pairA{border-color:var(--pair1-border); background:var(--pair1-bg);}
      .p-card.name.pairA{color:#4A2E08;}
      .p-card.pairB{border-color:var(--pair2-border); background:var(--pair2-bg);}
      .p-card.pendB{border-color:var(--pair2-border); background:var(--pair2-soft); box-shadow:0 0 0 2px var(--pair2-border), var(--shadow);}
      .p-dot{position:absolute; top:7px; left:7px; width:12px; height:12px; border-radius:50%; z-index:2;}
      .p-dot.dotA{background:var(--pair1-dot);}
      .p-dot.dotB{background:var(--pair2-dot);}
      .p-name-txt{font-size:clamp(15px, 4.4vw, 20px); font-weight:800; line-height:1.25; white-space:nowrap; pointer-events:none;}
      .p-confirm{
        flex:none; width:66px; border-radius:14px;
        background:var(--accent); color:var(--accent-ink); font-size:17px; font-weight:800; box-shadow:var(--shadow);
        display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; line-height:1.15;
      }
      .p-confirm:disabled{background:var(--chip); color:var(--sub); box-shadow:none; opacity:1;}
      /* first-miss bar */
      .p-miss{flex:none; margin-top:8px; background:var(--card); border:2.5px solid var(--amber); border-radius:16px; box-shadow:var(--shadow); padding:10px 12px;}
      .p-miss[hidden]{display:none;}
      .p-miss-msg{font-size:16.5px; font-weight:900; color:var(--accent); text-align:center; letter-spacing:.04em;}
      .p-miss-btns{display:flex; gap:8px; margin-top:8px;}
      .p-miss-retry{flex:1.4; min-height:48px; border-radius:12px; background:var(--accent); color:var(--accent-ink); font-size:15.5px; font-weight:800;}
      .p-miss-reveal{flex:1; min-height:48px; border-radius:12px; background:var(--card); border:2px solid var(--line); color:var(--sub); font-size:15.5px; font-weight:800;}
      /* feedback */
      .p-fb{flex:1 1 auto; min-height:0; display:flex; flex-direction:column; gap:8px;}
      :root{--pairH:104px; --cmpH:112px; --pair2H:64px;}
      .p-pair{
        flex:none; position:relative; display:flex; flex-direction:column; align-items:center;
        background:#F9ECCB; border:2.5px solid var(--good-border); border-radius:16px;
        padding:9px 12px 10px; box-shadow:var(--shadow); color:#221608; overflow:hidden;
      }
      .p-check{
        position:absolute; top:8px; left:8px; width:27px; height:27px; border-radius:50%;
        border:2px solid var(--good-border); background:#FFF6DC; color:var(--good);
        display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:900; line-height:1;
      }
      .p-fit{display:flex; align-items:center; justify-content:center; width:100%;}
      .p-fit img{max-width:100%; object-fit:contain;}
      .p-fit.mid{height:var(--pairH);} .p-fit.mid img{max-height:var(--pairH);}
      .p-fit.base{height:var(--cmpH);} .p-fit.base img{max-height:var(--cmpH);}
      .p-pair-name{display:flex; align-items:baseline; justify-content:center; gap:7px; flex-wrap:wrap; text-align:center; margin-top:2px;}
      .p-pair-name .nm{font-size:clamp(19px, 5.6vw, 25px); font-weight:900; line-height:1.2; color:#4A2E08;}
      .p-pair-name .fm{font-size:13.5px; font-weight:700; color:#8A6A2A;}
      /* two-pair compact pair cards: one wrapper = one celebration event */
      .p-pairs-wrap{flex:none; position:relative; display:flex; flex-direction:column; gap:6px; border-radius:16px;}
      .p-pair2{
        position:relative; display:flex; flex-direction:column; align-items:center;
        background:#F9ECCB; border:2.5px solid var(--good-border); border-radius:14px;
        padding:6px 12px 7px; box-shadow:var(--shadow); color:#221608; overflow:hidden;
      }
      .p-fit.sml{height:var(--pair2H);} .p-fit.sml img{max-height:var(--pair2H); max-width:82%;}
      .p-pair2 .p-pair-name{margin-top:1px;}
      .p-pair2 .p-pair-name .nm{font-size:clamp(16px, 4.8vw, 20px);}
      .p-pair2 .p-pair-name .fm{font-size:12.5px;}
      .p-pair2 .p-check{width:23px; height:23px; font-size:13px; top:6px; left:6px;}
      /* round 13: the — (never correct) pair card is de-emphasized —
         plain paper + thin muted sepia border — while its structure
         SVG, name and formula stay fully crisp: no opacity, no red. */
      .p-pair2.p-none-card{background:var(--pair-none-bg); border:1.5px solid var(--pair-none-border);}
      /* two-pair per-pair outcome marks (settled screens only) */
      .p-check.pm-retry{border-color:var(--amber); color:var(--accent);}
      .p-check.pm-none{border-color:#CDBFA9; color:#A08B6E;}
      /* two-pair board-level result, shown at the top of the feedback */
      .p-board-res{flex:none; display:flex; align-items:center; justify-content:center; gap:9px;}
      .p-board-chip{width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:17px; font-weight:900; line-height:1; border:2px solid var(--line); background:var(--chip); color:var(--sub);}
      .p-board-chip.m-first{border-color:var(--good-border); background:#F9ECCB; color:var(--good);}
      .p-board-chip.m-retry{border-color:var(--amber); background:var(--chip-on); color:var(--accent);}
      .p-board-txt{font-size:13.5px; font-weight:800; color:var(--sub); letter-spacing:.05em;}
      /* two-pair BOOST area: both targets stacked; measured fallback line */
      #pf-boost{display:flex; flex-direction:column; gap:6px;}
      .boost .bname{font-size:11px; font-weight:900; color:var(--good); white-space:nowrap;}
      .boost-note-line{
        border:1.5px dashed var(--boost-line); border-radius:10px; background:transparent;
        padding:7px 10px; font-size:12.5px; font-weight:700; color:var(--sub); line-height:1.5; text-align:center;
      }
      .boost-note-line b{color:var(--good);}
      .p-cmp{flex:none; background:var(--card); border:2px solid var(--line); border-radius:16px; padding:10px 12px 9px; box-shadow:var(--shadow);}
      .p-cmp-title{display:flex; align-items:center; gap:6px; font-size:12px; font-weight:800; color:var(--sub); letter-spacing:.06em; margin-bottom:7px;}
      .p-cmp-title::before{content:""; width:8px; height:8px; border-radius:3px; background:var(--accent); flex:none;}
      .p-cmp-frames{display:flex; gap:14px; align-items:stretch;}
      .p-cmp-frame{flex:1; min-width:0; display:flex; flex-direction:column; background:var(--tile); border:2px solid var(--line); border-radius:12px; padding:7px 6px 6px; color:#221608;}
      .p-cmp-frame .cn{margin-top:5px; font-size:13.5px; font-weight:800; text-align:center; line-height:1.2;}
      .p-fb .boost{margin-top:0;}
      /* pairing BOOST entrance: same language as the quiz feedback —
         fade/rise once per render; reduced motion keeps a gentle fade */
      #scr-pair-fb .boost{animation:boostEnter .38s ease-out both;}
      @media (prefers-reduced-motion: reduce){
        #scr-pair-fb .boost{animation:boostEnterCalm .55s ease both;}
      }
      .p-next{
        flex:none; width:100%; min-height:52px; margin-top:8px; border-radius:14px;
        background:var(--accent); color:var(--accent-ink); font-size:17px; font-weight:800; letter-spacing:.12em; box-shadow:var(--shadow);
      }
      /* pairing feedback effects (fixture Phase 4 port) */
      @keyframes pairBounce{0%{transform:scale(1)}35%{transform:scale(1.025)}70%{transform:scale(.995)}100%{transform:scale(1)}}
      .p-pair.fx-bounce{animation:pairBounce .3s ease-out;}
      @keyframes pairGlow{0%{box-shadow:0 0 0 0 rgba(217,142,4,0)}30%{box-shadow:0 0 0 5px rgba(217,142,4,.45)}100%{box-shadow:0 0 0 0 rgba(217,142,4,0)}}
      .p-pair.fx-ring{animation:pairGlow .55s ease-out;}
      .p-pair.calm-glow{animation:pairGlow .8s ease-out;}
      /* two-pair: BOTH cards celebrate as ONE combined T1 event on their
         wrapper — same keyframes, same timing as the one-pair card */
      .p-pairs-wrap.fx-bounce{animation:pairBounce .3s ease-out;}
      .p-pairs-wrap.fx-ring{animation:pairGlow .55s ease-out;}
      .p-pairs-wrap.calm-glow{animation:pairGlow .8s ease-out;}
      .p-star{position:absolute; color:#B97F06; font-weight:900; pointer-events:none; line-height:1; z-index:3; animation:pStarPop .55s ease-out both;}
      @keyframes pStarPop{0%{opacity:0; transform:translateY(4px) scale(.5)}30%{opacity:1}100%{opacity:0; transform:translateY(-12px) scale(1.15)}}
      @media (prefers-reduced-motion: reduce){
        .p-pair.fx-bounce, .p-pairs-wrap.fx-bounce{animation:none;}
        .p-star{display:none;}
      }
      /* pairing results */
      .p-res-wrap{flex:1 1 auto; display:flex; flex-direction:column; justify-content:center; gap:12px; max-width:440px; width:100%; margin:0 auto;}
      .p-res-card{position:relative; background:var(--card); border:2.5px solid var(--amber); border-radius:18px; box-shadow:var(--shadow); padding:20px 16px 16px; text-align:center;}
      .p-res-label{font-size:13px; font-weight:800; color:var(--sub); letter-spacing:.08em;}
      .p-res-score{font-weight:900; color:var(--accent); line-height:1.1; margin-top:2px;}
      .p-res-score b{font-size:52px;}
      .p-res-score span{font-size:24px; color:var(--sub);}
      .p-res-marks{display:flex; justify-content:center; gap:8px; margin-top:12px; flex-wrap:wrap;}
      .p-res-tally{margin-top:12px; font-size:14.5px; font-weight:800; color:var(--ink);}
      .p-res-tally b{color:var(--accent); font-size:17px;}
      .p-mark{width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:19px; font-weight:900; border:2px solid var(--line); background:var(--chip); color:var(--sub);}
      .p-mark.m-first{border-color:var(--good-border); background:#F9ECCB; color:var(--good);}
      .p-mark.m-retry{border-color:var(--amber); background:var(--chip-on); color:var(--accent);}
      .p-res-legend{margin-top:12px; font-size:12px; font-weight:700; color:var(--sub); line-height:1.6;}
      .p-res-again{width:100%; min-height:54px; border-radius:14px; background:var(--accent); color:var(--accent-ink); font-size:17px; font-weight:800; box-shadow:var(--shadow);}
      .p-res-home{width:100%; min-height:52px; border-radius:14px; background:var(--card); border:2px solid var(--line); color:var(--sub); font-size:16px; font-weight:800; box-shadow:var(--shadow);}
      .p-res-card.calm-glow{animation:pairGlow .8s ease-out;}
      /* pairing confetti lives in its own layer inside the results screen
         (top band only) and is emptied by cleanupPairFx on any exit */
      #fx-pair-res{bottom:auto; height:180px;}
      /* pairing compressed heights (fixture breakpoints) */
      @media (max-height:700px){
        :root{--pairH:82px; --cmpH:90px; --pair2H:50px;}
        .p-grid-s{gap:6px;} .p-grid-n{gap:5px;}
        .p-name-row{flex-basis:54px; margin-top:6px; gap:8px;}
        .p-card{border-radius:13px; padding:6px;}
        .p-confirm{font-size:16px;}
        .p-next{min-height:48px; font-size:16px; margin-top:6px;}
        .p-miss{margin-top:6px;} .p-miss-msg{font-size:15.5px;}
        .p-miss-retry, .p-miss-reveal{min-height:44px; font-size:14.5px;}
        .p-res-score b{font-size:44px;}
      }
      @media (max-height:560px){
        :root{--pairH:60px; --cmpH:66px; --pair2H:38px;}
        .p-head{height:40px;} .p-title{font-size:17px;}
        .p-grid-s{gap:5px;} .p-grid-n{gap:4px;}
        .p-name-row{margin-top:5px;}
        .p-card{border-radius:11px; padding:4px;}
        .p-name-txt{font-size:14px;}
        .p-pair{padding:7px 10px 8px;}
        .p-check{width:23px; height:23px; font-size:14px; top:6px; left:6px;}
        .p-pair-name .nm{font-size:17px;}
        .p-cmp{padding:7px 9px 6px;} .p-cmp-title{margin-bottom:5px;}
        .p-cmp-frame .cn{font-size:12px;}
        .p-cat{min-height:48px; font-size:16px;}
        .p-res-card{padding:14px 12px 12px;} .p-res-score b{font-size:38px;}
        .p-mark{width:34px; height:34px; font-size:16px;}
      }
    </style>
  </head>
  <body>
    <!-- HOME -->
    <section class="screen on" id="scr-home">
      <h1 class="ttl"><span class="orgo">Orgo</span><span class="rush">Rush<svg class="swoosh" viewBox="0 0 100 6" preserveAspectRatio="none" aria-hidden="true"><path d="M2 4.4 C 24 1.4, 42 5.6, 60 3.6 S 90 1.6, 98 3.2" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></span></h1>
      <p class="tagline">見分けて、覚えて、もう1問！</p>

      <div class="grp">
        <div class="seg" id="mode-seg" role="group" aria-label="モード">
          <button type="button" data-mode="normal" class="on"><svg class="mode-ico" viewBox="0 0 32 24" fill="currentColor" aria-hidden="true"><rect x="4" y="3" width="10" height="8" rx="2"/><rect x="18" y="3" width="10" height="8" rx="2"/><rect x="4" y="13" width="10" height="8" rx="2"/><rect x="18" y="13" width="10" height="8" rx="2"/></svg><span>四択ラッシュ</span></button>
          <button type="button" data-mode="versus"><svg class="mode-ico" viewBox="0 0 32 24" fill="currentColor" aria-hidden="true"><rect x="2" y="3" width="13" height="18" rx="2"/><rect x="17" y="3" width="13" height="18" rx="2"/></svg><span>見比べラッシュ</span></button>
          <button type="button" data-mode="pairing"><svg class="mode-ico" viewBox="0 0 32 24" fill="currentColor" aria-hidden="true"><rect x="3" y="2" width="9" height="9" rx="2"/><rect x="20" y="2" width="9" height="9" rx="2"/><rect x="3" y="13" width="9" height="9" rx="2"/><rect x="20" y="13" width="9" height="9" rx="2"/><path d="M7.5 17.5L24.5 6.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg><span>ペアリングラッシュ</span></button>
          <button type="button" data-mode="review"><svg class="mode-ico" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.65 6.35A8 8 0 1 0 19.73 14h-2.08a6 6 0 1 1-1.41-6.24L13 11h7V4l-2.35 2.35z"/></svg><span>苦手だけ復習</span> <span class="cnt" id="review-cnt" hidden>0</span></button>
        </div>
      </div>

      <div class="grp">
        <div class="unit-grid" id="unit-grid"></div>
      </div>

      <div class="grp">
        <div class="seg" id="diff-seg" role="group" aria-label="難易度">
          <button type="button" data-diff="easy">やさしい</button>
          <button type="button" data-diff="normal" class="on">ふつう</button>
          <button type="button" data-diff="hard">むずかしい</button>
        </div>
      </div>

      <div class="grp">
        <div class="seg" id="dir-seg" role="group" aria-label="出題方向">
          <button type="button" data-dir="A" class="on">名前→構造</button>
          <button type="button" data-dir="B" class="on">構造→名前</button>
          <button type="button" data-dir="C">性質→名前</button>
          <button type="button" data-dir="D">性質→構造</button>
        </div>
      </div>

      <div class="week-bar" id="week-bar" aria-label="週間目標">
        <span class="wk-label">今週</span>
        <span class="week-dots" id="week-dots"><i></i><i></i><i></i></span>
        <span id="week-text">0/3 セット</span>
        <span class="wk-done" id="week-done" hidden>達成</span>
        <span class="wk-total" id="week-total">累計 0 セット</span>
      </div>

      <p class="home-notice" id="home-notice" role="alert" hidden></p>
      <button type="button" class="start-btn" id="start-btn">スタート</button>
      <button type="button" class="zukan-btn" id="zukan-btn">図鑑</button>
    </section>

    <!-- PAIRING START -->
    <section class="screen" id="scr-pair-start">
      <div class="p-head">
        <button type="button" class="q-back" id="ps-back" aria-label="ホームへ戻る">←</button>
        <div class="p-title">ペアリングラッシュ</div>
      </div>
      <div class="p-start-wrap">
        <div class="seg" id="ps-seg-sub" role="group" aria-label="サブモード">
          <button type="button" data-sub="one" class="on">ワンペアラッシュ</button>
          <button type="button" data-sub="two">ツーペアラッシュ</button>
        </div>
        <div class="seg" id="ps-seg-count" role="group" aria-label="問題数">
          <button type="button" data-count="5" class="on">5問</button>
          <button type="button" data-count="10">10問</button>
        </div>
        <div class="p-cats">
          <button type="button" class="p-cat on" id="ps-cat-ali" aria-pressed="true"><span class="u-check" aria-hidden="true">✓</span><span>脂肪族</span><span class="cnt" id="ps-cat-ali-cnt">12題</span></button>
          <button type="button" class="p-cat on" id="ps-cat-aro" aria-pressed="true"><span class="u-check" aria-hidden="true">✓</span><span>芳香族</span><span class="cnt" id="ps-cat-aro-cnt">11題</span></button>
        </div>
        <p class="p-start-msg" id="ps-msg" hidden></p>
        <button type="button" class="p-start-btn" id="ps-start">スタート</button>
      </div>
    </section>

    <!-- PAIRING QUESTION -->
    <section class="screen" id="scr-pair-q">
      <div class="p-head">
        <button type="button" class="q-back" id="pq-back" aria-label="終了する">←</button>
        <div class="q-mode"><span id="pq-mode">ワンペア</span></div>
        <span class="p-prog" id="pq-prog"><b>1</b> / 5</span>
      </div>
      <div class="p-grid-s" id="pq-structs"></div>
      <div class="p-name-row">
        <div class="p-grid-n" id="pq-names"></div>
        <button type="button" class="p-confirm" id="pq-confirm" disabled><span>確</span><span>定</span></button>
      </div>
      <div class="p-miss" id="pq-miss" hidden>
        <div class="p-miss-msg">ちがう組み合わせ！</div>
        <div class="p-miss-btns">
          <button type="button" class="p-miss-retry" id="pq-retry">もう一度考える</button>
          <button type="button" class="p-miss-reveal" id="pq-reveal">答えを見る</button>
        </div>
      </div>
    </section>

    <!-- PAIRING FEEDBACK -->
    <section class="screen" id="scr-pair-fb">
      <div class="p-head">
        <button type="button" class="q-back" id="pf-back" aria-label="終了する">←</button>
        <div class="q-mode"><span id="pf-mode">ワンペア</span></div>
        <span class="p-prog" id="pf-prog"><b>1</b> / 5</span>
      </div>
      <div class="p-fb" id="pf-body"></div>
      <button type="button" class="p-next" id="pf-next">次へ</button>
    </section>

    <!-- PAIRING RESULTS -->
    <section class="screen" id="scr-pair-res">
      <div class="p-res-wrap">
        <div class="p-res-card" id="pr-card">
          <div class="p-res-label">はじめから正解</div>
          <div class="p-res-score"><b id="pr-score">0</b><span id="pr-total"> / 5</span></div>
          <div class="p-res-marks" id="pr-marks"></div>
          <div class="p-res-tally" id="pr-tally" hidden></div>
          <div class="p-res-legend">✓ はじめから正解　◇ リトライで正解　— 答えを見た</div>
          <div class="p-res-legend" id="pr-pair-legend" hidden>ペアごとの記録：✓ 初回で正解　◇ 再挑戦で正解　— 未正解</div>
        </div>
        <button type="button" class="p-res-again" id="pr-again">もう一度</button>
        <button type="button" class="p-res-home" id="pr-home">ホームに戻る</button>
      </div>
      <div class="fx-layer" id="fx-pair-res" aria-hidden="true"></div>
    </section>

    <!-- QUIZ -->
    <section class="screen" id="scr-quiz" aria-live="off">
      <div class="q-head">
        <button type="button" class="q-back" id="q-back" aria-label="ホームへ戻る">←</button>
        <div class="q-prog">
          <div class="q-bar"><i id="q-bar-fill" style="width:0%"></i></div>
          <div class="q-count" id="q-count">1/10</div>
        </div>
        <div class="q-mode" id="q-mode" aria-label="現在のモード"></div>
        <div class="q-combo" id="q-combo">コンボ 0</div>
      </div>

      <div class="q-main" id="q-main"></div>

      <div class="q-choices c4" id="q-choices"></div>

      <div class="q-feedback" id="q-feedback"></div>

      <div class="q-foot">
        <button type="button" class="next-btn" id="next-btn">次へ</button>
      </div>
      <div class="fx-layer" id="fx-quiz" aria-hidden="true"></div>
    </section>

    <!-- RESULT -->
    <section class="screen" id="scr-result">
      <div class="r-score"><div class="num"><span id="r-num">0</span><span> / </span><span id="r-den">10</span></div></div>
      <div class="r-combo" id="r-combo"></div>
      <div class="r-stats" id="r-stats"></div>
      <p class="r-miss-label" id="r-miss-label">まちがえた化合物</p>
      <div class="r-miss" id="r-miss"></div>
      <div class="r-btns">
        <button type="button" class="primary" id="r-revenge" hidden>あと1問リベンジ</button>
        <button type="button" id="r-review">苦手復習</button>
        <button type="button" id="r-again">もう10問</button>
        <button type="button" class="wide" id="r-home">ホーム</button>
      </div>
      <div class="fx-layer" id="fx-result" aria-hidden="true"></div>
    </section>

    <!-- ZUKAN -->
    <section class="screen" id="scr-zukan">
      <div class="z-head">
        <button type="button" class="q-back" id="z-back" aria-label="ホームへ戻る">←</button>
        <div class="z-title">図鑑</div>
        <div class="z-counts">
          <div class="z-count" id="z-master-count">習得 0/121</div>
          <div class="z-count" id="z-count">正解した 0/121</div>
        </div>
      </div>
      <div class="grp" style="margin-top:6px">
        <div class="chips" id="z-range-chips">
          <button type="button" data-zrange="all" class="on">すべて</button>
          <button type="button" data-zrange="skel:脂肪族">脂肪族</button>
          <button type="button" data-zrange="skel:芳香族">芳香族</button>
        </div>
        <button type="button" class="fg-toggle" id="z-fg-toggle" aria-expanded="false" aria-controls="z-fg-panel">
          <span id="z-fg-label">官能基：すべて</span><span class="fg-caret" aria-hidden="true">▾</span>
        </button>
        <div class="fg-panel" id="z-fg-panel" hidden>
          <div class="fg-chips" id="z-fg-chips"></div>
        </div>
      </div>
      <div class="z-grid" id="z-grid"></div>
    </section>

    <!-- ZUKAN DETAIL -->
    <section class="screen" id="scr-detail">
      <div class="z-head">
        <button type="button" class="q-back" id="d-back" aria-label="図鑑へ戻る">←</button>
        <div class="z-title">詳細</div>
      </div>
      <div class="d-main" id="d-main"></div>
    </section>

    <script>

/* CHEM BOOST! notes: ~/workspace/orgorush/data/extra-notes.json (121 entries, all teacher-approved 2026-11-09). Keyed by compound id; methyl-acetate uses the adopted alternative text. */
const BOOST_NOTES = {"ethylene":{"tag":"反応","text":"C=Cはσ結合とπ結合からなり、付加反応ではπ結合が切れて新しい結合ができる。臭素水の脱色も、この構造変化から説明できる。"},"cis-2-butene":{"tag":"見分け","text":"C=Cのまわりは自由に回転できないため、シス形とトランス形は簡単には入れ替わらない。単結合の回転との違いが見分けの鍵。"},"polyacetylene":{"tag":"構造","text":"炭素鎖に単結合と二重結合が交互に並ぶ「共役構造」をもつ。ヨウ素などによるドーピング（電荷を生じさせる処理）で導電性が大きく高まる。"},"2-propanol":{"tag":"見分け","text":"ヨードホルム反応はCH₃–CH(OH)–型の構造が目印。第2級アルコールだけでなく、第1級のエタノールも例外的に陽性を示す。"},"maleic-acid":{"tag":"構造","text":"シス形では2つのCOOH基が近く、分子内で脱水して環状の酸無水物をつくりやすい。トランス形のフマル酸との違いを考えよう。"},"glycerol":{"tag":"反応","text":"3つのOH基がそれぞれ脂肪酸とエステル結合すると、油脂の主成分トリアシルグリセロールができる。結合する脂肪酸は3つとも同じとは限らない。"},"benzene":{"tag":"構造","text":"ベンゼン環のC−C結合6本は、実際にはすべて等しい長さ。π電子が環全体に広がっているためで、普通のアルケンより付加反応を受けにくい。"},"p-xylene":{"tag":"反応","text":"2つのメチル基を酸化してできるテレフタル酸は、エチレングリコールと縮合重合し、PETになる。身近なペットボトルへつながる反応だ。"},"naphthalene":{"tag":"構造","text":"2つの環を合わせて、π電子は10個。環全体に電子が広がる「芳香族性」があり、普通のアルケンのような付加反応より置換反応を起こしやすい。"},"phenol":{"tag":"入試","text":"フェノールがエタノールより酸性を示すのは、H⁺を放したあとのフェノキシドイオンで負電荷が環に分散して安定するため。NaOHと反応する。"},"salicylic-acid":{"tag":"見分け","text":"フェノール性OHをアセチル化するとアスピリン、COOHをメタノールでエステル化するとサリチル酸メチル。どちらのOHが反応するか見分けよう。"},"aspirin":{"tag":"入試","text":"アスピリンのフェノール性OHはエステルに変わり、FeCl₃では呈色しない。一方、COOH基は残り、炭酸水素ナトリウムと反応する。"},"methane":{"tag":"反応","text":"塩素と光を当てて反応させると、HがClに置き換わる置換反応が進む。置換は1回で止まらず、条件によって塩素置換体が複数生じる。"},"ethane":{"tag":"構造","text":"C–C単結合の回転で、H同士が重なる「重なり形」とずれる「ねじれ形」をとる。ねじれ形の方がエネルギーが低く安定している。"},"propane":{"tag":"反応","text":"両端の炭素と中央の炭素では、結合しているHの環境が異なる。塩素による置換では、1-クロロプロパンと2-クロロプロパンが生じ得る。"},"butane":{"tag":"構造","text":"中央のC–C結合を軸に回転すると、両端のCH₃基が離れた「アンチ形」が最も安定。分子式も結合順序も同じまま、立体配置だけが変わる。"},"pentane":{"tag":"見分け","text":"同じ分子式の枝分かれした異性体より、直鎖のペンタンは分子同士が接触しやすい。そのため分散力が強まり、一般に沸点が高くなる。"},"hexane":{"tag":"入試","text":"炭素6個のアルカンには構造異性体が5種類ある。主鎖の長さや枝分かれの位置を変えても、分子式C₆H₁₄が変わらないことを確かめよう。"},"2-methylpropane":{"tag":"反応","text":"中心の炭素はほかの炭素3個と結合した第3級炭素で、Hは1個だけ。このHと末端のCH₃基のHは、置換反応で区別される。"},"2-methylbutane":{"tag":"入試","text":"名前を付けるときは、まず最も長い炭素鎖を主鎖に選ぶ。この分子の主鎖は4個で、枝の番号が小さくなる側から「2位」と数える。"},"23-dimethylbutane":{"tag":"構造","text":"分子の中央を境に対称な構造をもつ。4つのCH₃基は互いに等価なので、Hを1個だけClに置換したとき、構造の異なる生成物は2種類となる。"},"cyclopropane":{"tag":"構造","text":"三員環のC–C–C結合角は約60°で、通常の飽和炭素の約109.5°から大きくずれる。この角度のひずみが、反応性の高さにつながる。"},"cyclobutane":{"tag":"構造","text":"四角形の構造式から平面の正方形を想像しがちだが、実際の環は少し折れ曲がる。隣のC–H結合の重なりを減らし、ひずみを緩和している。"},"cyclopentane":{"tag":"構造","text":"五員環は平面の正五角形ではなく、炭素の一部が面から外れた形をとる。隣り合うC–H結合の重なりを避け、分子のエネルギーを下げるためだ。"},"cyclohexane":{"tag":"構造","text":"六員環は平面の正六角形ではなく、椅子のように折れ曲がった「いす形」をとる。結合角と隣接する結合の向きが、ひずみの小ささを生む。"},"propene":{"tag":"反応","text":"通常の条件でHBrを付加すると、主に2-ブロモプロパンが生じる。Hが二重結合の末端側に付く向きが優先するという、付加の向きに注目。"},"1-butene":{"tag":"反応","text":"水素を付加して二重結合を単結合にすると、1-ブテンも2-ブテンも同じブタンになる。二重結合の位置が違っても、生成物では区別できない。"},"trans-2-butene":{"tag":"見分け","text":"トランス形は2つのCH₃基が二重結合の反対側にあり、シス形より互いに近づきにくい。立体的な反発が小さく、一般に安定性が高い。"},"2-methylpropene":{"tag":"反応","text":"通常の条件でHClを付加すると、Clが枝分かれした炭素側に付く。より安定な第3級カルボカチオン（正電荷をもつ炭素）を経るためだ。"},"2-pentene":{"tag":"反応","text":"二重結合の両側の炭素にはHが1個ずつある。HBrの付加では結合位置の違いにより、2-ブロモペンタンと3-ブロモペンタンが生じ得る。"},"13-butadiene":{"tag":"反応","text":"2つの二重結合が単結合を1本挟む「共役構造」をもつ。付加反応では、1位と4位に原子が付く1,4-付加も起こり、二重結合の位置が変わる。"},"cyclopentene":{"tag":"入試","text":"分子式C₅H₈から求める不飽和度は2。これは五員環1つとC=C結合1つに対応する。環があるだけで不飽和度が1増える点を押さえよう。"},"cyclohexene":{"tag":"反応","text":"臭素の付加では、2つのBrが二重結合の反対側から入る「アンチ付加」が起こる。そのため生成物では、2つのBrが環の反対側に位置する。"},"acetylene":{"tag":"反応","text":"C≡Cはσ結合1本とπ結合2本からなる。水素を1分子付加するとエチレン、さらに1分子付加するとエタンになり、三重結合の変化を追える。"},"propyne":{"tag":"反応","text":"酸性条件で水銀(Ⅱ)触媒を用いて水を付加すると、いったんエノール（C=CにOHをもつ構造）を経てアセトンになる。これはケトンへの変化の例。"},"1-butyne":{"tag":"見分け","text":"末端の≡C–Hは、内部に三重結合をもつ2-ブチンにはない。このHはアルケンのHより酸性が強く、強塩基で引き抜ける点も違い。"},"2-butyne":{"tag":"反応","text":"2-ブチンの部分還元では、反応性を抑えたリンドラー触媒でシス形、金属と液体アンモニアでトランス形の2-ブテンが得られる。"},"3-methyl-1-butyne":{"tag":"入試","text":"名前を付けるときは三重結合を含む最長の炭素鎖を選び、三重結合に近い端から番号を付ける。枝のメチル基は3位になり、名前と構造が対応する。"},"chloromethane":{"tag":"反応","text":"C–Cl結合は極性をもち、OH⁻が炭素を攻撃するとCl⁻が外れてメタノールになる。これは原子団が入れ替わる求核置換反応の基本例。"},"dichloromethane":{"tag":"構造","text":"CH₂Cl₂の炭素原子は正四面体状に4つの原子と結合する。C–Cl結合の極性は分子全体では打ち消されず、極性分子になる。"},"trichloromethane":{"tag":"見分け","text":"CHCl₃は炭素にClが3個とHが1個結合した構造。同じCHX₃型のヨードホルムCHI₃と比べると、ハロゲンの違いで物性が大きく変わる。"},"tetrachloromethane":{"tag":"構造","text":"C–Cl結合には極性があるが、CCl₄では4本が正四面体状に対称配置される。そのため分子全体の極性は打ち消され、無極性分子になる。"},"chloroethane":{"tag":"反応","text":"クロロエタンはOH⁻との反応条件によって、ClをOHに置き換えるとエタノール、HClを取り除くとエチレンを生じる。置換と脱離の比較例。"},"12-dichloroethane":{"tag":"反応","text":"ClCH₂–CH₂ClからHClを1分子取り除くと塩化ビニルになる。そのC=Cを付加重合するとポリ塩化ビニルができ、脱離と重合がつながる。"},"12-dibromoethane":{"tag":"反応","text":"隣り合う炭素にBrが1個ずつ付いている。亜鉛によってこの2個のBrを取り除くとC=Cが再生し、エチレンに戻る。付加の逆向きの反応だ。"},"1122-tetrabromoethane":{"tag":"反応","text":"アセチレンにBr₂を1分子付加した段階ではC=Cが残り、さらに1分子付加すると単結合のみになる。Brの数と多重結合の変化を対応させよう。"},"vinyl-chloride":{"tag":"構造","text":"塩化ビニルCH₂=CHClのC=Cを開いて重合すると、繰り返し単位–CH₂–CH(Cl)–になる。Clは主鎖の炭素に残る。"},"vinyl-acetate":{"tag":"反応","text":"酢酸ビニルを付加重合するとポリ酢酸ビニルになる。さらにエステル部分を加水分解すると、OH基をもつポリビニルアルコールに変わる。"},"polyethylene":{"tag":"構造","text":"繰り返し単位は–CH₂–CH₂–。炭素鎖の枝分かれが少ないほど密に並びやすく、一般に密度が高まる。高密度品と低密度品を分ける鍵だ。"},"acrylonitrile":{"tag":"構造","text":"CH₂=CH–C≡NのC=Cが付加重合して主鎖になる一方、C≡N（ニトリル基）はそのまま残る。高分子の側に残る官能基に注目しよう。"},"ethanol":{"tag":"反応","text":"濃硫酸と加熱すると、条件によって分子内脱水でエチレン、分子間脱水でジエチルエーテルが生じる。反応温度の違いで生成物が変わる例。"},"acetaldehyde":{"tag":"見分け","text":"銀鏡・フェーリング反応はアルデヒド基の還元性による。一方、ヨードホルム反応はCH₃CO–部分が決め手。この化合物は3つの反応すべてに陽性。"},"acetic-acid":{"tag":"反応","text":"酢酸とエタノールは酸触媒のもとで反応し、酢酸エチルと水を生じる。反応は可逆なので、水を除くと平衡がエステル生成側に移る。"},"methanol":{"tag":"反応","text":"第1級アルコールの酸化では、アルデヒドを経てカルボン酸へ進むことがある。メタノールの場合、炭素1個のギ酸まで酸化される。"},"1-propanol":{"tag":"見分け","text":"同じ分子式の2-プロパノールとはOH基の位置が異なる。1-プロパノールは酸化でアルデヒドを経て酸へ、2-プロパノールはケトンへ進む。"},"1-butanol":{"tag":"構造","text":"炭素鎖が枝分かれすると分子同士が接触しにくくなり、分散力が弱まる。同じC₄H₁₀Oのアルコールでも、直鎖のものは一般に沸点が高い。"},"2-butanol":{"tag":"構造","text":"OH基の付いた炭素は、CH₃・C₂H₅・H・OHという異なる4つの基に結合している。そのため不斉炭素となり、鏡像異性体が存在する。"},"ethylene-glycol":{"tag":"反応","text":"2つのOH基をもつため、ジカルボン酸と両端でエステル結合をつくり、鎖を伸ばせる。テレフタル酸との縮合重合ではPETになる。"},"diethyl-ether":{"tag":"見分け","text":"エーテルのO原子は水と水素結合できるが、エーテル分子同士では水素結合をつくれない。この違いがアルコールより沸点が低い一因となる。"},"formic-acid":{"tag":"見分け","text":"ギ酸のH–COOHでは、カルボキシ基の炭素にHが直接結合している。酸化されるとCO₂になりやすく、ほかの一般的なカルボン酸と還元性が異なる。"},"propionic-acid":{"tag":"見分け","text":"プロピオン酸と酢酸メチルは、同じ分子式C₃H₆O₂の構造異性体。カルボン酸とエステルでは、炭酸水素ナトリウムとの反応性が異なる。"},"ethyl-acetate":{"tag":"反応","text":"塩基性水溶液中で加熱すると、エステル結合が加水分解され、酢酸イオンとエタノールになる。生成した酸が塩になるため逆反応が進みにくい。"},"methyl-acetate":{"tag":"構造","text":"酢酸メチルは極性のあるC=Oをもつが、O–H結合がないため分子同士では水素結合しない。水とは水素結合でき、比較的揮発しやすい溶媒となる。"},"methyl-formate":{"tag":"見分け","text":"ギ酸メチルはH–COO–CH₃、酢酸はCH₃–COOH。同じ分子式でも、カルボニル基の周りの結合が違うとエステルとカルボン酸に分かれる。"},"acetone":{"tag":"反応","text":"C=Oに水素を付加して還元すると、OHをもつ2-プロパノールになる。ケトンの還元で第2級アルコールが生じることを、構造式で確かめよう。"},"formaldehyde":{"tag":"反応","text":"カルボニル炭素にHが2個結合する最も単純なアルデヒド。酸化すると炭素1個のギ酸になる。さらに酸化するとCO₂へ進み得る。"},"dimethyl-ether":{"tag":"見分け","text":"酸素原子は水と水素結合できるが、O–H結合をもたないため分子同士では水素結合できない。沸点がエタノールより低い理由はここにある。"},"methyl-ethyl-ketone":{"tag":"見分け","text":"C=Oをもつがアルデヒドではないため、通常は銀鏡反応を示さない。一方、CH₃CO–部分があるのでヨードホルム反応は陽性となる。"},"propionaldehyde":{"tag":"構造","text":"CH₃CH₂CHOのC=Oは分子の端にあり、その炭素にはHが結合する。ケトンと異なり酸化されやすい理由を、このHの有無から考えよう。"},"lactic-acid":{"tag":"反応","text":"乳酸は一分子にOH基とCOOH基をもつため、分子同士がエステル結合でつながり、ポリ乳酸をつくれる。小さな官能基が高分子の構造を決める。"},"fumaric-acid":{"tag":"見分け","text":"マレイン酸とはCOOH基の向きだけが異なるが、水への溶けやすさや融点に大きな差がある。分子の形が結晶中での並び方にも影響するためだ。"},"acetic-anhydride":{"tag":"反応","text":"無水酢酸はアルコールなどのOH基へアセチル基CH₃CO–を移す反応に使う。サリチル酸のフェノール性OHを変えるとアスピリンができる。"},"iodoform":{"tag":"反応","text":"ヨードホルム反応では、CH₃CO–のCH₃にあった3個のHがIに置き換わった後、C–C結合が切れてCHI₃が生じる。炭素の由来を追おう。"},"palmitic-acid":{"tag":"反応","text":"NaOHで中和するとパルミチン酸ナトリウムになる。長い炭化水素鎖は油になじみ、COO⁻部分は水になじむため、セッケンとして働く。"},"stearic-acid":{"tag":"構造","text":"パルミチン酸より炭素鎖が2個分長く、分子間に働く分散力が大きい。融点も高く、飽和脂肪酸では鎖の長さが物性に影響することがわかる。"},"oxalic-acid":{"tag":"入試","text":"酸性条件の過マンガン酸カリウムで酸化すると、シュウ酸の炭素はCO₂になる。MnO₄⁻とシュウ酸の物質量比は2：5で、滴定計算に使える。"},"2-methyl-2-propanol":{"tag":"反応","text":"酸触媒のもとで脱水すると、2-メチルプロペンが生じる。OH基の付いた炭素の隣からHが取れ、炭素間に二重結合ができる反応だ。"},"butyric-acid":{"tag":"反応","text":"刺激臭のある酪酸でも、エタノールとエステル化するとパイナップル様の香りをもつ酪酸エチルになる。官能基の変化で物性も大きく変わる。"},"maleic-anhydride":{"tag":"反応","text":"C=Cを残しており、1,3-ブタジエンなどと反応して六員環をつくれる。これをディールス・アルダー反応（環を形成する付加反応）という。"},"sodium-ethoxide":{"tag":"反応","text":"C₂H₅O⁻は強い塩基で、炭素を攻撃する求核剤としても働く。CH₃Brと反応させるとBr⁻が外れ、メチルエチルエーテルができる。"},"toluene":{"tag":"反応","text":"CH₃基は環へ電子を与えるため、ベンゼンより求電子置換反応を受けやすい。次の置換基は主にオルト位・パラ位に入り、メタ位は少ない。"},"ethylbenzene":{"tag":"見分け","text":"側鎖の強い酸化には、環に直結する炭素（ベンジル位）のHが重要。この分子にはHがあるが、Hのないtert-ブチルベンゼンは酸化されにくい。"},"styrene":{"tag":"構造","text":"ベンゼン環と側鎖のC=Cはπ電子が連続する「共役構造」をつくる。芳香族の環とアルケンの側鎖では、同じπ電子系でも反応性が異なる。"},"o-xylene":{"tag":"入試","text":"環上のHは4個あるが、分子の対称性により3位と6位、4位と5位がそれぞれ等価。同じ置換基を1つ加えた位置異性体は2種類になる。"},"m-xylene":{"tag":"反応","text":"2つのCH₃基はどちらもオルト・パラ配向性を示す。両者に挟まれた2位は混み合うため、次の求電子置換では4位や6位が有利になりやすい。"},"cumene":{"tag":"反応","text":"側鎖のベンジル位にはHが1個あり、酸化で過酸化物を生じる。その後の分解ではフェニル基が酸素へ移動する「転位」が起こる。"},"chlorobenzene":{"tag":"入試","text":"Clは環から電子を引いて置換反応を遅くするが、孤立電子対を環へ与えるため次の置換はオルト・パラ位に向かう。反応性と配向性は別だ。"},"o-dichlorobenzene":{"tag":"構造","text":"C–Cl結合には極性がある。o-体では2本の結合の向きが対称に打ち消し合わず、分子全体も極性をもつ。p-体ではほぼ相殺される。"},"m-dichlorobenzene":{"tag":"見分け","text":"同じC₆H₄Cl₂でも、m-体の融点は約−25℃で常温では液体。一方、p-体は約53℃で固体となり、置換位置で物性が大きく変わる。"},"p-dichlorobenzene":{"tag":"構造","text":"p-体は置換基が対称に並ぶため、分子が結晶中で規則正しく並びやすい。o-体やm-体より融点が高いのは、分子の形と結晶の関係を示す例。"},"benzenesulfonic-acid":{"tag":"反応","text":"スルホン化は条件により逆向きにも進み、熱い希酸中ではSO₃H基を外せる。置換基を一度付けて取り除く発想は、芳香環の反応を考える鍵。"},"nitrobenzene":{"tag":"入試","text":"NO₂基は環から電子を強く引くため、次の求電子置換ではオルト・パラ位の反応途中が不安定になる。結果としてメタ位への置換が優先する。"},"o-nitrotoluene":{"tag":"入試","text":"CH₃はオルト・パラ配向、NO₂はメタ配向。両者の指示が重なる4位と6位が次の置換候補だが、CH₃基に近い6位は立体的に不利。"},"p-nitrotoluene":{"tag":"入試","text":"CH₃が1位、NO₂が4位なら、両者が優先させる次の置換位置は2位と6位。これらは分子の対称性で等価なので、その位置に入る生成物は1種類。"},"246-trinitrotoluene":{"tag":"構造","text":"CH₃基のオルト・パラ配向は2・4・6位の配置を考える手掛かり。ただしNO₂基は環の電子を引き、2・6位ではCH₃基との立体反発もある。"},"cumene-hydroperoxide":{"tag":"構造","text":"–OOHは炭素に結合する–OHとは違い、酸素同士が直接つながるヒドロペルオキシド基。O–O結合の切れやすさが反応性の鍵になる。"},"sodium-benzenesulfonate":{"tag":"反応","text":"–SO₃Naの硫黄を含む部分は、強い塩基による融解で–ONaへ置き換わる。通常の水溶液での置換と違い、高温が必要な芳香環の反応だ。"},"o-cresol":{"tag":"入試","text":"OHは環のオルト・パラ位、CH₃もオルト・パラ位を活性化するが、隣り合うと指す位置が一致しない。より強いOHの効果に注目しよう。"},"m-cresol":{"tag":"入試","text":"OHとCH₃が1,3位にあると、どちらも2・4・6位を置換しやすくする。ただし2位は両基に挟まれ、立体障害で反応しにくくなりやすい。"},"p-cresol":{"tag":"見分け","text":"CH₃基は電子を与えるため、p-クレゾールのOHからH⁺が外れた陰イオンをフェノールほど安定化しない。そのため酸性はやや弱くなる。"},"1-naphthol":{"tag":"反応","text":"OH基の電子供与でナフタレン環の一部が反応しやすくなる。ジアゾニウムイオンとのカップリングでは、主にOHの反対側に当たる4位で結合できる。"},"2-naphthol":{"tag":"反応","text":"ジアゾニウムイオンとのカップリングは、OHの隣にあたる1位で起こりやすい。1-ナフトールと同じ分子式でも、反応する位置が異なる。"},"sodium-phenoxide":{"tag":"反応","text":"O⁻の電子がベンゼン環に広がるため、環のオルト・パラ位が反応しやすい。CO₂との反応と酸処理で、主にオルト位へCOOHを導ける。"},"246-tribromophenol":{"tag":"反応","text":"OH基は環へ電子を与え、2・4・6位を強く活性化する。そのためベンゼンと異なり、Feなどの触媒なしでも臭素と置換反応しやすい。"},"picric-acid":{"tag":"構造","text":"NO₂基3個は電子を強く引き、H⁺を失ったフェノキシドイオンの負電荷を安定化する。そのため通常のフェノールよりずっと酸性が強い。"},"phenyl-acetate":{"tag":"反応","text":"酢酸フェニルではCH₃COO–がOを介してベンゼン環につながる。塩基性加水分解で酢酸塩とフェノキシドができ、酸処理でフェノールになる。"},"benzyl-alcohol":{"tag":"見分け","text":"ベンジルアルコールのOHは環に直結せず、CH₂を挟んでいる。フェノールのように陰イオンが環と共鳴できず、NaOHとは通常反応しない。"},"benzaldehyde":{"tag":"反応","text":"ベンズアルデヒドにはC=Oの隣にHをもつ炭素がない。濃い塩基性条件では、2分子が酸化と還元に分かれるカニッツァロ反応を示す。"},"benzoic-acid":{"tag":"入試","text":"COOH基は環から電子を引くので、ベンゼンより求電子置換が起こりにくくなる。次の置換は主にメタ位へ進む点がCH₃基と対照的。"},"sodium-benzoate":{"tag":"見分け","text":"安息香酸のpKaは約4.2。溶液のpHがこれより低いと、イオンの形より分子の安息香酸が多くなる。保存料の働きにも関係する。"},"phthalic-acid":{"tag":"構造","text":"隣り合う2つのCOOH基は互いに影響し、1個目のH⁺が外れるときと2個目では酸の強さが大きく異なる。2段階の電離に注目しよう。"},"isophthalic-acid":{"tag":"入試","text":"1位と3位のCOOH基はどちらも電子を引くメタ配向性基。新たな求電子置換の位置を予想すると、両者の指示が重なる5位が候補になる。"},"terephthalic-acid":{"tag":"構造","text":"2つのCOOH基が環の反対側にあり、両端でエステル結合して鎖を伸ばせる。硬い芳香環が高分子鎖に組み込まれ、PETの性質にも関係する。"},"phthalic-anhydride":{"tag":"反応","text":"環状の酸無水物はアルコールと反応すると環が開き、片側はエステル、もう片側はCOOHとして残る。環の開閉と官能基の変化に注目。"},"sodium-salicylate":{"tag":"構造","text":"COO⁻の負電荷は2個のO原子に分散して安定する。酸を加えるとCOOHに戻る一方、環に結合したフェノール性OHはそのまま残る。"},"methyl-salicylate":{"tag":"見分け","text":"サリチル酸のCOOHだけがメチルエステルになり、フェノール性OHは残っている。このためFeCl₃による呈色は保たれ、アスピリンと区別できる。"},"aniline":{"tag":"構造","text":"Nの孤立電子対はベンゼン環にも広がるため、脂肪族アミンよりH⁺を受け取りにくい。塩基性の弱さは、環との共鳴から理解できる。"},"anilinium-chloride":{"tag":"入試","text":"アニリンがH⁺を受け取ると、Nの孤立電子対は結合に使われ、環へ電子を与えにくくなる。NH₃⁺基は求電子置換でメタ配向性を示す。"},"acetanilide":{"tag":"構造","text":"NH₂をNHCOCH₃に変えると、Nの電子がC=O側にも広がり、環への電子供与が弱まる。それでもオルト・パラ配向性は残る。"},"benzenediazonium-chloride":{"tag":"反応","text":"環に結合した–N₂⁺は、電子の豊富なフェノール環と結び付く反応ができる。このジアゾカップリングでは–N=N–結合が新しく生まれる。"},"p-phenylazophenol":{"tag":"構造","text":"2つのベンゼン環をつなぐ–N=N–の周囲でπ電子が広がり、可視光を吸収する。色は発色団（光を吸収する部分）の共役によって生まれる。"}};
const byId = {};
DATA.compounds.forEach(c => { byId[c.id] = c; });
const $ = s => document.querySelector(s);

/* ---------- storage (orgorush:v1) Phase 3 schema ---------- */
const ALLOW_UNAPPROVED_QUESTIONS = true;
const LS_KEY = "orgorush:v1";
function defaultRec() { return { seen: false, everCorrect: false, mastered: false, needsReview: false, missLevel: 0, reviewStage: 0, nextReviewDate: null, fourChoiceSuccessCount: 0, lastFourChoiceSuccessSessionId: null, hasStructureFourChoiceCorrect: false }; }
function normalizeRec(r) { const d = defaultRec(); if (r && typeof r === "object") { Object.keys(d).forEach(k => { if (r[k] !== undefined) d[k] = r[k]; }); } return d; }
let store = { schemaVersion: 1, onboardingCompleted: false, totalCompletedSessions: 0, bestCombo: 0, weeklyCounts: {}, compounds: {} };
function needsReviewIds() { return Object.keys(store.compounds).filter(id => store.compounds[id].needsReview); }
function recOf(id) { return store.compounds[id] ? store.compounds[id] : defaultRec(); }
function ensureRec(id) { if (!store.compounds[id]) store.compounds[id] = defaultRec(); return store.compounds[id]; }
function fmtDate(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function todayLocal() { return fmtDate(new Date()); }
function addDaysStr(dateStr, days) { const base = dateStr ? new Date(dateStr + "T00:00:00") : new Date(); base.setDate(base.getDate() + days); return fmtDate(base); }
function mondayKey() { const d = new Date(); d.setHours(0,0,0,0); const dow = (d.getDay() + 6) % 7; d.setDate(d.getDate() - dow); return fmtDate(d); }
/* Weekly goal eligibility (Chap round 9, teacher-approved): only a
   COMPLETED session of a primary ラッシュ mode counts as exactly one
   set, with no score threshold. The quiz modes are listed here with
   their required question count — normal = 四択ラッシュ (10問),
   versus = 見比べラッシュ (10問). Pairing (5 boards) counts through
   pairCompleteSession() below, guarded by its own `counted` flag.
   review (復習) and revenge (リベンジ) are deliberately absent from
   this allowlist and never count, and an incomplete session never
   reaches the completion handler that reads this table. */
const WEEKLY_QUIZ_SETS = { normal: 10, versus: 10 };
(function migrateStore() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return;
    const p = JSON.parse(raw);
    if (!p || typeof p !== "object") return;
    store.onboardingCompleted = !!(p.onboardingCompleted !== undefined ? p.onboardingCompleted : p.introDone);
    if (typeof p.totalCompletedSessions === "number") store.totalCompletedSessions = p.totalCompletedSessions;
    if (typeof p.bestCombo === "number") store.bestCombo = p.bestCombo;
    if (p.weeklyCounts && typeof p.weeklyCounts === "object") store.weeklyCounts = p.weeklyCounts;
    if (p.compounds && typeof p.compounds === "object") {

/* ---------- similarity / distractors ---------- */
function carbonCount(c) {
  if (!c.formula || c.formula.includes(")n")) return null;
  const m = c.formula.match(/^C(\d*)/);
  if (!m) return 0;
  return m[1] === "" ? 1 : parseInt(m[1], 10);
}
function simScore(t, c) {
  let s = 0;
  if (c.formula === t.formula) s += 50;
  const shared = c.functionalGroups.filter(g => t.functionalGroups.includes(g)).length;
  s += shared * 30;
  const ct = carbonCount(t), cc = carbonCount(c);
  if (ct !== null && cc !== null) s += Math.max(0, 12 - Math.abs(ct - cc) * 3);
  const sharedTag = c.tags.filter(g => t.tags.includes(g)).length;
  s += sharedTag * 6;
  return s;
}
function shuffle(a) { const x = a.slice(); for (let i = x.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [x[i], x[j]] = [x[j], x[i]]; } return x; }
function pickByDiff(cands, target, n, diff) {
  const scored = cands.map(c => ({ c, s: simScore(target, c) + Math.random() * 4 }));
  if (diff === "hard") scored.sort((a, b) => b.s - a.s);
  else if (diff === "easy") scored.sort((a, b) => a.s - b.s);
  else scored.sort(() => Math.random() - 0.5);
  if (diff === "normal") { // mid-similarity bias: sort by closeness to median score
    const sorted = scored.slice().sort((a, b) => a.s - b.s);
    const med = sorted.length ? sorted[Math.floor(sorted.length / 2)].s : 0;
    scored.sort((a, b) => Math.abs(a.s - med) - Math.abs(b.s - med));
  }

}
/* Same-unit rule: same skeleton first at every difficulty; relax in stages, never outside range. */
function chooseDistractors(target, pool, n, diff) {
  /* If the given pool cannot fill n distractors (e.g. a range with <4 compounds),
     widen ONLY the distractor pool to all compounds so a question never ships
     with fewer choices while any alternative exists. */
  let effPool = pool;
  if (pool.filter(c => c.id !== target.id).length < n) {
    effPool = pool.concat(DATA.compounds.filter(c => !pool.some(p => p.id === c.id)));
  }
  const others = effPool.filter(c => c.id !== target.id);
  const sameSkel = others.filter(c => c.skeletonCategory === target.skeletonCategory);
  const sameSkelFg = sameSkel.filter(c => c.functionalGroups.some(g => target.functionalGroups.includes(g)));
  const crossFg = others.filter(c => c.skeletonCategory !== target.skeletonCategory && c.functionalGroups.some(g => target.functionalGroups.includes(g)));
  let picked = [];
  const take = (list, k) => { const p = pickByDiff(list.filter(c => !picked.includes(c)), target, k, diff); picked = picked.concat(p); };
  // rivals first, respecting each rival's level against the chosen difficulty:
  // やさしい -> only やさしい rivals; ふつう -> ふつう then やさしい; むずかしい -> むずかしい then ふつう.
  // No rival at a preferred level: fall through to the normal similarity selection.
  const levelOrder = diff === "easy" ? ["やさしい"] : diff === "hard" ? ["むずかしい", "ふつう"] : ["ふつう", "やさしい"];
  for (const lv of levelOrder) {
    const rv = DATA.rivals.filter(r => r.targetId === target.id && r.level === lv).map(r => byId[r.distractorId])
      .filter(c => c && others.includes(c) && !picked.includes(c));
    if (rv.length) { picked.push(rv[Math.floor(Math.random() * rv.length)]); break; }
  }
  if (picked.length < n) take(sameSkelFg, n - picked.length);
  if (picked.length < n) take(sameSkel, n - picked.length);
  if (picked.length < n) take(crossFg, n - picked.length);
  if (picked.length < n) take(others, n - picked.length);
  return picked.slice(0, n);
}

/* ---------- spaced-repetition target weighting (spec 5.5/5.6) ---------- */
/* weight: missLevel 0 -> x1, 1 -> x3, 2 -> x5; due review (stage 1-3, nextReviewDate <= today) -> at least x3; cap x5 */
function targetWeight(c) {
  const r = recOf(c.id);
  let w = 1;
  if (r.missLevel === 1) w = 3;
  else if (r.missLevel >= 2) w = 5;
  if (r.reviewStage >= 1 && r.reviewStage <= 3 && r.nextReviewDate && todayLocal() >= r.nextReviewDate) {
    w = Math.max(w, 3);
  }
  return Math.min(5, w);
}
/* Weighted sampling without replacement: no duplicate targets, weights only rank within the given pool. */
function weightedPick(pool, n) {
  const items = pool.slice();
  const picked = [];
  const want = Math.min(n, items.length);
  while (picked.length < want) {
    let total = 0;
    items.forEach(c => { total += targetWeight(c); });
    let x = Math.random() * total;
    let idx = items.length - 1;
    for (let i = 0; i < items.length; i++) { x -= targetWeight(items[i]); if (x <= 0) { idx = i; break; } }
    picked.push(items[idx]);
    items.splice(idx, 1);
  }
  return picked;
}

/* ---------- session building ---------- */
function eligibleC(pool) {
  const inPool = new Set(pool.map(c => c.id));
  return DATA.pQuestions.filter(q => (ALLOW_UNAPPROVED_QUESTIONS || q.approved) && inPool.has(q.targetId) && q.distractorIds.every(id => inPool.has(id)));
}
function makeQuestion(target, dir, pool, diff, twoChoice) {
  if (dir === "C" || dir === "D") {
    /* C and D share the registered, teacher-approved property-question sets:
       same targetId and distractorIds; D only changes the answer form to structures. */
    const q = DATA.pQuestions.find(x => x.targetId === target.id);
    return { target, dir, choices: shuffle([target].concat(q.distractorIds.map(id => byId[id]))) };
  }
  const n = twoChoice ? 1 : 3;
  const ds = chooseDistractors(target, pool, n, diff);
